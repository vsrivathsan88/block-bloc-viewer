<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>great room · planner</title>
    <style>
      :root {
        --bg: #12131a;
        --panel: rgba(18, 19, 26, 0.82);
        --edge: rgba(255, 255, 255, 0.1);
        --fg: #e9e9f2;
        --dim: rgba(233, 233, 242, 0.55);
        --accent: #7fb2e5;
        --warn: #e58b7f;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
      canvas { display: block; }

      .panel { position: fixed; z-index: 12; background: var(--panel); border: 1px solid var(--edge);
        border-radius: 12px; backdrop-filter: blur(14px); }
      .panel h4 { margin: 0 0 8px; font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
        color: var(--dim); font-weight: 600; }

      #hud { top: 12px; left: 12px; padding: 12px 14px; max-width: 290px; }
      #hud .title { font-size: 15px; font-weight: 600; }
      #hud .sub { font-size: 11px; color: var(--dim); margin-top: 2px; }
      #hud .status { font-size: 11px; margin-top: 8px; color: var(--accent); }

      #modes { top: 12px; left: 50%; transform: translateX(-50%); padding: 6px; display: flex; gap: 4px; }
      #modes button { background: transparent; border: 0; color: var(--dim); padding: 7px 14px; border-radius: 8px;
        font: inherit; font-size: 12px; cursor: pointer; }
      #modes button:hover { color: var(--fg); background: rgba(255,255,255,.06); }
      #modes button.on { background: var(--accent); color: #0d1017; font-weight: 600; }

      #side { top: 64px; right: 12px; width: 258px; max-height: calc(100vh - 88px); padding: 12px 14px;
        overflow-y: auto; overscroll-behavior: contain; }
      #side::-webkit-scrollbar { width: 6px; }
      #side::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 3px; }
      .zone { margin-bottom: 12px; }
      .zone > .zname { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-bottom: 3px; }
      .row { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 6px; cursor: pointer; font-size: 12px; }
      .row:hover { background: rgba(255,255,255,.06); }
      .row.sel { background: rgba(127,178,229,.2); color: #fff; }
      .row.fixed { color: var(--dim); cursor: default; }
      .row.off { text-decoration: line-through; opacity: .4; }
      .row .sw { width: 8px; height: 8px; border-radius: 2px; flex: none; }

      #insp { bottom: 12px; left: 12px; padding: 12px 14px; width: 262px; display: none; }
      #insp.show { display: block; }
      #insp .name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
      #insp .meta { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
      #insp .btns { display: flex; gap: 5px; margin-top: 9px; flex-wrap: wrap; }
      button.b { background: rgba(255,255,255,.08); border: 1px solid var(--edge); color: var(--fg);
        padding: 5px 9px; border-radius: 7px; font: inherit; font-size: 11px; cursor: pointer; }
      button.b:hover { background: rgba(255,255,255,.15); }
      button.b.danger:hover { background: rgba(229,139,127,.25); border-color: var(--warn); }

      #layouts { bottom: 12px; left: 50%; transform: translateX(-50%); padding: 8px 10px; display: flex;
        gap: 5px; align-items: center; flex-wrap: wrap; max-width: 62vw; justify-content: center; }
      #layouts select { background: rgba(255,255,255,.08); border: 1px solid var(--edge); color: var(--fg);
        padding: 5px 7px; border-radius: 7px; font: inherit; font-size: 11px; max-width: 190px; }

      #help { bottom: 12px; right: 12px; padding: 10px 12px; font-size: 11px; color: var(--dim); max-width: 258px; }
      #help kbd { background: rgba(255,255,255,.12); color: var(--fg); padding: 1px 5px; border-radius: 3px;
        font-family: ui-monospace, monospace; font-size: 10px; }
      #help .line { margin: 2px 0; }

      #compare { position: fixed; inset: 0; z-index: 5; pointer-events: none; display: none; }
      #compare.show { display: block; }
      #compare img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #cambar { top: 64px; left: 12px; padding: 10px 12px; width: 290px; display: none; }
      #cambar.show { display: block; }
      #cambar .cams { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
      #cambar .cams button { flex: 1 1 44px; }
      #cambar input[type=range] { width: 100%; }
      #cambar .note { font-size: 10px; color: var(--dim); margin-top: 6px; }

      #toast { position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%); z-index: 30;
        background: rgba(10,11,16,.94); border: 1px solid var(--edge); padding: 8px 14px; border-radius: 999px;
        font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; }
      #toast.show { opacity: 1; }
      /* Sits *below* .panel so the mode bar stays clickable while the
         "click to walk" scrim is up — otherwise walk mode is a dead end. */
      #lock { position: fixed; inset: 0; z-index: 8; display: none; align-items: center; justify-content: center;
        background: rgba(8,9,13,.55); backdrop-filter: blur(3px); cursor: pointer; }
      #lock.show { display: flex; }
      #lock div { text-align: center; }
      #lock .big { font-size: 17px; margin-bottom: 6px; }
      #lock .small { font-size: 12px; color: var(--dim); }
    </style>
  </head>
  <body>
    <div id="hud" class="panel">
      <div class="title" id="h-title">great room</div>
      <div class="sub" id="h-sub">loading…</div>
      <div class="status" id="h-status"></div>
    </div>

    <div id="modes" class="panel">
      <button data-mode="orbit" class="on">3D</button>
      <button data-mode="plan">Plan</button>
      <button data-mode="walk">Walk</button>
      <button id="btn-compare">Compare</button>
    </div>

    <div id="cambar" class="panel">
      <h4>photo compare</h4>
      <div class="cams" id="cam-btns"></div>
      <label style="font-size:11px;color:var(--dim)">overlay <span id="ov-val">50%</span></label>
      <input type="range" id="ov" min="0" max="100" value="50" />
      <div class="note" id="cam-note"></div>
    </div>

    <div id="side" class="panel"></div>

    <div id="insp" class="panel">
      <div class="name" id="i-name">—</div>
      <div class="meta" id="i-meta"></div>
      <div class="btns">
        <button class="b" data-act="rot-ccw">⟲ 15°</button>
        <button class="b" data-act="rot-cw">⟳ 15°</button>
        <button class="b" data-act="reset">reset pose</button>
        <button class="b danger" data-act="hide">hide</button>
      </div>
    </div>

    <div id="layouts" class="panel">
      <select id="preset"></select>
      <button class="b" id="b-save">save as…</button>
      <button class="b" id="b-link">copy link</button>
      <button class="b" id="b-reset">reset all</button>
    </div>

    <div id="help" class="panel">
      <div class="line"><kbd>drag</kbd> move furniture · <kbd>click</kbd> select</div>
      <div class="line"><kbd>Q</kbd><kbd>E</kbd> rotate 15° (<kbd>⇧</kbd> 5°) · <kbd>↑</kbd><kbd>↓</kbd> height</div>
      <div class="line"><kbd>Del</kbd> hide · <kbd>Esc</kbd> deselect</div>
      <div class="line" id="help-mode">orbit: <kbd>drag</kbd> rotate · <kbd>scroll</kbd> zoom</div>
    </div>

    <div id="compare"><img id="compare-img" alt="" /></div>
    <div id="toast"></div>
    <div id="lock"><div><div class="big">click to walk</div><div class="small">WASD move · mouse look · ⇧ run · Esc release</div></div></div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://esm.sh/three@0.180.0",
          "three/addons/": "https://esm.sh/three@0.180.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      /* ══════════════════════════════════════════════════════════════════
         Coordinate convention
         ──────────────────────────────────────────────────────────────────
         Schema plan is (x east, y north) in metres, height h up.
         three.js is y-up, so we map:  (x, y, h) → (x - cx, h, -(y - cy))
         i.e. schema +y (north) becomes three -z. The room is centred on
         the origin so orbiting behaves.

         That mapping mirrors handedness, so plan rotation `rot` (degrees,
         increasing clockwise in plan) becomes three rotation.y = -rot.
         An object is authored facing local +z, which lands as:
           rot   0° → faces south (-y)      180° → faces north (+y)
           rot  90° → faces west  (-x)      270° → faces east  (+x)
         ══════════════════════════════════════════════════════════════════ */

      const D2R = Math.PI / 180;
      const $ = (s) => document.querySelector(s);
      const SCHEMA_URL = new URLSearchParams(location.search).get("schema") || "./schemas/great-room.json";

      /* ─────────────────────────── procedural textures ───────────────── */
      // Deterministic noise so the room looks the same every reload.
      let _seed = 20260803;
      const rnd = () => ((_seed = (_seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);

      function tex(w, h, draw, rx = 1, ry = 1) {
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        draw(c.getContext("2d"), w, h);
        const t = new THREE.CanvasTexture(c);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(rx, ry);
        t.colorSpace = THREE.SRGBColorSpace;
        t.anisotropy = 8;
        return t;
      }
      const jit = (hex, amt) => {
        const c = new THREE.Color(hex);
        const f = 1 + (rnd() - 0.5) * amt;
        return `#${c.multiplyScalar(f).getHexString()}`;
      };

      const TEX = {};

      /* Per-colour texture/material factories, memoised.
         Textures bake their own base colour, so the material's `color` must
         stay white — tinting a colour-baked map with the same colour squares
         it and drives everything toward black. Any object colour therefore
         generates its own texture rather than reusing a shared one. */
      const _cache = new Map();
      const cached = (k, make) => (_cache.has(k) ? _cache.get(k) : (_cache.set(k, make()), _cache.get(k)));

      const softTex = (base, amt = 0.15, spec = "255,255,255") =>
        cached(`soft|${base}|${amt}|${spec}`, () => tex(128, 128, (g) => {
          g.fillStyle = base; g.fillRect(0, 0, 128, 128);
          for (let i = 0; i < 5200; i++) {
            g.fillStyle = `rgba(${spec},${rnd() * amt})`;
            g.fillRect(rnd() * 128, rnd() * 128, 1.5, 1.5);
          }
        }, 4, 4));
      const fabricMat = (hex, rough = 0.87) =>
        cached(`fab|${hex}|${rough}`, () =>
          new THREE.MeshStandardMaterial({ map: softTex(hex), roughness: rough }));

      // Cherry / stained-wood grain generated over an arbitrary base colour.
      const woodTex = (base) => cached(`wood|${base}`, () => tex(256, 256, (g) => {
        g.fillStyle = base; g.fillRect(0, 0, 256, 256);
        for (let s = 0; s < 90; s++) {
          g.strokeStyle = `rgba(24,10,5,${0.04 + rnd() * 0.13})`;
          g.lineWidth = 0.5 + rnd() * 2.2;
          const x = rnd() * 256;
          g.beginPath(); g.moveTo(x, 0);
          g.bezierCurveTo(x + (rnd() - 0.5) * 26, 90, x + (rnd() - 0.5) * 26, 175, x + (rnd() - 0.5) * 16, 256);
          g.stroke();
        }
        for (let s = 0; s < 30; s++) {
          g.strokeStyle = `rgba(255,205,170,${0.04 + rnd() * 0.1})`;
          g.lineWidth = 0.6 + rnd() * 1.4;
          const x = rnd() * 256;
          g.beginPath(); g.moveTo(x, 0); g.lineTo(x + (rnd() - 0.5) * 14, 256); g.stroke();
        }
      }));
      const woodMat = (hex, rough = 0.42) =>
        cached(`woodm|${hex}|${rough}`, () =>
          new THREE.MeshStandardMaterial({ map: woodTex(hex), roughness: rough, metalness: 0.05 }));

      /* Soft contact shadow laid under each floor object. A single shadow-mapped
         sun can't produce the dark, tight occlusion where furniture meets the
         floor, and without it everything reads as floating slightly. */
      const contactMat = () => cached("contact", () => {
        // Stacked rounded rects, largest first, build a soft-edged dark patch
        // that follows the footprint. A radial gradient would put its darkest
        // part in the middle — entirely hidden under the object — leaving only
        // a faint halo. The shadow has to read at the edge, where it touches.
        // The plane is 1.55x the footprint, so the object's silhouette lands at
        // inset ~45 of 256. Darkness has to peak *there* and fade outward — the
        // only part of this texture anyone ever sees is the ring outside the
        // silhouette, so that ring is where the shadow has to live.
        const EDGE = 45;
        const t = tex(256, 256, (g) => {
          const steps = 24;
          for (let i = 0; i <= steps; i++) {
            const k = i / steps;                    // 0 = outer edge, 1 = silhouette
            const inset = 5 + k * (EDGE - 5);
            g.fillStyle = `rgba(10,7,5,${(0.055 * k * k).toFixed(4)})`;
            g.beginPath();
            g.roundRect(inset, inset, 256 - inset * 2, 256 - inset * 2, 26);
            g.fill();
          }
          g.fillStyle = "rgba(10,7,5,.30)";         // core, hidden under the object
          g.beginPath();
          g.roundRect(EDGE, EDGE, 256 - EDGE * 2, 256 - EDGE * 2, 20);
          g.fill();
        });
        t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
        return new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false });
      });
      function addContactShadow(group, rec) {
        if ((rec.mount || "floor") !== "floor" || rec.elevation > 0.02) return;
        if (rec.type === "rug" || rec.size.h < 0.25) return;
        const sh = new THREE.Mesh(
          new THREE.PlaneGeometry(rec.size.w * 1.55, rec.size.d * 1.55), contactMat());
        sh.rotation.x = -Math.PI / 2;
        sh.position.y = 0.016;          // clears the rug's 0.012 top face
        sh.renderOrder = 2;
        sh.userData.oid = rec.id;
        group.add(sh);
      }

      function buildTextures(pal) {
        // Wide-plank wood floor. One tile = 1.2 m × 1.2 m, planks running north–south.
        TEX.floor = tex(512, 512, (g) => {
          g.fillStyle = pal.floor; g.fillRect(0, 0, 512, 512);
          const pw = 64;
          for (let i = 0; i < 8; i++) {
            g.fillStyle = jit(pal.floor, 0.22);
            g.fillRect(i * pw, 0, pw, 512);
            // end joints
            let y = rnd() * 300;
            while (y < 512) {
              g.strokeStyle = "rgba(0,0,0,.28)"; g.lineWidth = 1.4;
              g.beginPath(); g.moveTo(i * pw, y); g.lineTo(i * pw + pw, y); g.stroke();
              y += 180 + rnd() * 260;
            }
            // grain
            for (let s = 0; s < 22; s++) {
              g.strokeStyle = `rgba(70,40,22,${0.05 + rnd() * 0.12})`;
              g.lineWidth = 0.6 + rnd() * 1.6;
              const x = i * pw + rnd() * pw;
              g.beginPath(); g.moveTo(x, 0);
              g.bezierCurveTo(x + (rnd() - 0.5) * 12, 170, x + (rnd() - 0.5) * 12, 340, x + (rnd() - 0.5) * 8, 512);
              g.stroke();
            }
            g.strokeStyle = "rgba(0,0,0,.22)"; g.lineWidth = 1;
            g.beginPath(); g.moveTo(i * pw + 0.5, 0); g.lineTo(i * pw + 0.5, 512); g.stroke();
          }
        }, 1, 1);

        TEX.wall = tex(256, 256, (g) => {
          g.fillStyle = pal.wall; g.fillRect(0, 0, 256, 256);
          for (let i = 0; i < 5000; i++) {
            g.fillStyle = `rgba(255,255,255,${rnd() * 0.05})`;
            g.fillRect(rnd() * 256, rnd() * 256, 1.4, 1.4);
          }
          for (let i = 0; i < 2200; i++) {
            g.fillStyle = `rgba(90,72,48,${rnd() * 0.045})`;
            g.fillRect(rnd() * 256, rnd() * 256, 1.6, 1.6);
          }
        }, 3, 3);

        TEX.quartz = tex(256, 256, (g) => {
          g.fillStyle = pal.quartz; g.fillRect(0, 0, 256, 256);
          for (let i = 0; i < 2600; i++) {
            g.fillStyle = `rgba(140,140,140,${rnd() * 0.16})`;
            g.fillRect(rnd() * 256, rnd() * 256, 1 + rnd(), 1 + rnd());
          }
          for (let v = 0; v < 5; v++) {
            g.strokeStyle = `rgba(160,158,150,${0.06 + rnd() * 0.06})`;
            g.lineWidth = 2 + rnd() * 5;
            const y = rnd() * 256;
            g.beginPath(); g.moveTo(0, y);
            g.bezierCurveTo(80, y + (rnd() - 0.5) * 50, 170, y + (rnd() - 0.5) * 50, 256, y + (rnd() - 0.5) * 30);
            g.stroke();
          }
        }, 2, 2);

        TEX.cherry = woodTex(pal.cherry);

        // Linear glass-mosaic backsplash: one tile = 0.30 m × 0.15 m.
        TEX.mosaic = tex(256, 128, (g) => {
          g.fillStyle = "#cfcabf"; g.fillRect(0, 0, 256, 128);
          const cols = ["#8fa3ad", "#b9c4c6", "#e3ded2", "#6f8894", "#cdd4cf", "#a89e8c", "#7f95a2"];
          const tw = 32, th = 12;
          for (let r = 0; r * th < 128; r++) {
            const off = (r % 2) * 16;
            for (let c = -1; c * tw < 256 + tw; c++) {
              g.fillStyle = cols[(rnd() * cols.length) | 0];
              g.fillRect(c * tw + off + 1, r * th + 1, tw - 2, th - 2);
              g.fillStyle = `rgba(255,255,255,${rnd() * 0.28})`;
              g.fillRect(c * tw + off + 1, r * th + 1, tw - 2, 2.5);
            }
          }
        }, 1, 1);

        TEX.velvet = softTex(pal.velvet_blue);
        TEX.greyFab = softTex(pal.fabric_grey);
        TEX.creamFab = softTex(pal.fabric_cream);
        TEX.carpet = softTex(pal.carpet, 0.2, "70,55,38");

        TEX.rug = tex(256, 256, (g) => {
          g.fillStyle = "#ded6c6"; g.fillRect(0, 0, 256, 256);
          for (let r = 0; r < 26; r++) {
            g.strokeStyle = `rgba(150,146,136,${0.22 + (r % 3) * 0.12})`;
            g.lineWidth = 1.6;
            g.beginPath();
            for (let x = 0; x <= 256; x += 8) g.lineTo(x, r * 10 + Math.sin(x / 12 + r) * 3.4);
            g.stroke();
          }
          for (let i = 0; i < 4000; i++) {
            g.fillStyle = `rgba(255,255,255,${rnd() * 0.1})`;
            g.fillRect(rnd() * 256, rnd() * 256, 1.5, 1.5);
          }
        }, 1, 1);

        TEX.steel = tex(64, 256, (g) => {
          const grd = g.createLinearGradient(0, 0, 64, 0);
          grd.addColorStop(0, "#9ea3a8"); grd.addColorStop(0.35, "#c8ccd0");
          grd.addColorStop(0.6, "#aeb3b8"); grd.addColorStop(1, "#8f959b");
          g.fillStyle = grd; g.fillRect(0, 0, 64, 256);
          for (let i = 0; i < 900; i++) {
            g.strokeStyle = `rgba(255,255,255,${rnd() * 0.14})`;
            g.lineWidth = 0.5;
            const y = rnd() * 256;
            g.beginPath(); g.moveTo(0, y); g.lineTo(64, y); g.stroke();
          }
        }, 1, 1);

        // Blue circular swirl canvas on the media console.
        TEX.swirlArt = tex(256, 256, (g) => {
          g.fillStyle = "#e7ddc9"; g.fillRect(0, 0, 256, 256);
          g.save(); g.translate(128, 128);
          for (let i = 0; i < 26; i++) {
            g.strokeStyle = `rgba(${28 + rnd() * 40},${50 + rnd() * 40},${105 + rnd() * 60},${0.45 + rnd() * 0.5})`;
            g.lineWidth = 3 + rnd() * 12;
            g.beginPath();
            const r0 = 26 + i * 3.2, a0 = rnd() * 6.28;
            g.arc(0, 0, r0, a0, a0 + 3.6 + rnd() * 2.2);
            g.stroke();
          }
          g.strokeStyle = "rgba(240,236,226,.9)"; g.lineWidth = 9;
          g.beginPath(); g.arc(0, 0, 40, 1.2, 4.4); g.stroke();
          g.restore();
        }, 1, 1);

        // Dark-blue botanical prints in the dining nook.
        TEX.blueArt = tex(128, 160, (g) => {
          g.fillStyle = "#1d3557"; g.fillRect(0, 0, 128, 160);
          g.strokeStyle = "rgba(228,236,240,.82)";
          for (let b = 0; b < 6; b++) {
            g.lineWidth = 1 + rnd() * 1.6;
            const x0 = 30 + rnd() * 68, y0 = 150;
            g.beginPath(); g.moveTo(x0, y0);
            g.bezierCurveTo(x0 + (rnd() - 0.5) * 30, 110, x0 + (rnd() - 0.5) * 40, 66, x0 + (rnd() - 0.5) * 24, 22);
            g.stroke();
            for (let l = 0; l < 8; l++) {
              const t = 0.15 + l * 0.1, px = x0 + (rnd() - 0.5) * 26, py = y0 - t * 128;
              g.beginPath(); g.moveTo(px, py);
              g.quadraticCurveTo(px + (rnd() - 0.5) * 24, py - 9, px + (rnd() - 0.5) * 30, py - 2);
              g.stroke();
            }
          }
        }, 1, 1);

        // Pale pencil-sketch cityscape.
        TEX.sketchArt = tex(160, 128, (g) => {
          g.fillStyle = "#f2efe8"; g.fillRect(0, 0, 160, 128);
          for (let i = 0; i < 46; i++) {
            g.fillStyle = `rgba(110,106,98,${0.06 + rnd() * 0.2})`;
            const w = 8 + rnd() * 22, h = 14 + rnd() * 58, x = rnd() * 160;
            g.fillRect(x, 104 - h, w, h);
            g.strokeStyle = `rgba(70,68,64,${0.12 + rnd() * 0.2})`; g.lineWidth = 0.7;
            g.strokeRect(x, 104 - h, w, h);
          }
          g.strokeStyle = "rgba(90,88,82,.35)"; g.lineWidth = 1.2;
          g.beginPath(); g.moveTo(0, 105); g.lineTo(160, 105); g.stroke();
        }, 1, 1);

        // Horizontal-fold roman / vignette shades — every window has one.
        TEX.shade = tex(64, 128, (g) => {
          g.fillStyle = "#f6f4ef"; g.fillRect(0, 0, 64, 128);
          for (let i = 0; i < 9; i++) {
            const y = i * 14;
            const grd = g.createLinearGradient(0, y, 0, y + 14);
            grd.addColorStop(0, "rgba(255,255,255,.95)");
            grd.addColorStop(0.72, "rgba(232,228,219,.95)");
            grd.addColorStop(1, "rgba(196,190,178,.95)");
            g.fillStyle = grd; g.fillRect(0, y, 64, 14);
          }
        }, 1, 1);
      }

      /* ─────────────────────────── materials ─────────────────────────── */
      const MAT = {};
      function buildMaterials(pal) {
        const std = (o) => new THREE.MeshStandardMaterial(o);
        MAT.floor   = std({ map: TEX.floor, roughness: 0.55, metalness: 0.02 });
        MAT.wall    = std({ map: TEX.wall, roughness: 0.92, metalness: 0 });
        MAT.ceiling = std({ color: pal.ceiling, roughness: 0.96 });
        MAT.trim    = std({ color: pal.trim, roughness: 0.5 });
        MAT.cherry  = woodMat(pal.cherry);
        MAT.quartz  = std({ map: TEX.quartz, roughness: 0.24, metalness: 0.02 });
        MAT.mosaic  = std({ map: TEX.mosaic, roughness: 0.3, metalness: 0.08 });
        MAT.steel   = std({ map: TEX.steel, roughness: 0.34, metalness: 0.5, envMapIntensity: 1.4 });
        MAT.nickel  = std({ color: "#c2c6c9", roughness: 0.28, metalness: 0.6, envMapIntensity: 1.5 });
        MAT.dark    = std({ color: "#2b2b2e", roughness: 0.55, metalness: 0.3 });
        MAT.wood    = std({ color: "#3a2a24", roughness: 0.45 });
        MAT.lightwood = std({ color: "#c9a97e", roughness: 0.55 });
        MAT.velvet  = std({ map: TEX.velvet, roughness: 0.88 });
        MAT.greyFab = std({ map: TEX.greyFab, roughness: 0.86 });
        MAT.creamFab= std({ map: TEX.creamFab, roughness: 0.86 });
        MAT.carpet  = std({ map: TEX.carpet, roughness: 0.95 });
        MAT.rug     = std({ map: TEX.rug, roughness: 0.94 });
        MAT.shade   = std({ map: TEX.shade, roughness: 0.85, side: THREE.DoubleSide });
        MAT.glass   = std({ color: "#dfeaef", roughness: 0.06, metalness: 0.1,
                            transparent: true, opacity: 0.24, side: THREE.DoubleSide });
        MAT.glassGreen = std({ color: "#8fc7ae", roughness: 0.1, metalness: 0.1, transparent: true, opacity: 0.55 });
        MAT.glassClear = std({ color: "#cfd6d8", roughness: 0.08, metalness: 0.15, transparent: true, opacity: 0.42 });
        MAT.bulb    = std({ color: "#fff4de", emissive: "#ffe9c4", emissiveIntensity: 1.5, roughness: 0.5 });
        MAT.shadeGlass = std({ color: "#f4ecdc", emissive: "#ffe6bc", emissiveIntensity: 0.55, roughness: 0.6,
                               transparent: true, opacity: 0.9 });
      }
      const box = (w, h, d, m) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
      const cyl = (rt, rb, h, m, seg = 24) => new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m);
      const at = (mesh, x, y, z) => { mesh.position.set(x, y, z); return mesh; };
      const panelMat = (hex) => woodMat(hex);   // cabinet / console casework

      /* ─────────────────────────── scene setup ───────────────────────── */
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.97;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const persp = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.03, 220);
      const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.05, 120);
      let camera = persp;

      const controls = new OrbitControls(persp, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.075;
      controls.maxPolarAngle = Math.PI * 0.495;
      const planControls = new OrbitControls(ortho, renderer.domElement);
      planControls.enableRotate = false;
      planControls.enableDamping = true;
      planControls.screenSpacePanning = true;
      planControls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
      planControls.enabled = false;

      /* ─────────────────────────── state ────────────────────────────── */
      const S = {
        schema: null, pal: null, W: 0, D: 0, H: 0, cx: 0, cy: 0,
        shell: new THREE.Group(), items: new THREE.Group(), labels: new THREE.Group(),
        recs: new Map(),      // id → live record {position,rotation_deg,elevation,hidden}
        base: new Map(),      // id → pristine pose from the schema
        groups: new Map(),    // id → THREE.Group
        children: new Map(),  // host id → [{id, dx, dy}] for decor riding on furniture
        blockers: [],         // static plan rects (walls, cabinets) for collision + walk
        mode: "orbit", sel: null,
        drag: null, lastValid: null,
        compare: false, camIdx: 0, photos: new Map(),
      };
      scene.add(S.shell, S.items, S.labels);

      const toThree = (x, y, h = 0) => new THREE.Vector3(x - S.cx, h, -(y - S.cy));

      /* ─────────────────────────── shell: floor/ceiling/walls ─────────── */
      function buildShell() {
        const { W, D, H, pal } = S;
        const g = S.shell;

        const floorTex = TEX.floor.clone();
        floorTex.needsUpdate = true;
        floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
        floorTex.repeat.set(W / 1.2, D / 1.2);
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, D),
          new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.55 }));
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        floor.name = "__floor";
        g.add(floor);

        const ceil = new THREE.Mesh(new THREE.PlaneGeometry(W, D), MAT.ceiling);
        ceil.rotation.x = Math.PI / 2;
        ceil.position.y = H;
        g.add(ceil);

        for (const w of S.schema.walls) buildWall(w, g);
        buildExterior(g);
      }

      // A wall is emitted as solid boxes around its openings, then each
      // opening gets a frame / glass / sill / shade assembly.
      function buildWall(w, parent) {
        const { H } = S;
        const a = toThree(w.start.x, w.start.y, 0);
        const b = toThree(w.end.x, w.end.y, 0);
        const dx = b.x - a.x, dz = b.z - a.z;
        const len = Math.hypot(dx, dz);
        const ang = Math.atan2(-dz, dx);          // see convention note
        const t = w.thickness;

        const grp = new THREE.Group();
        grp.position.set((a.x + b.x) / 2, 0, (a.z + b.z) / 2);
        grp.rotation.y = ang;
        parent.add(grp);
        // Inside `grp`: local +x runs start→end, local +z is the wall normal.

        const ops = S.schema.openings
          .filter((o) => o.wall === w.id)
          .map((o) => ({ ...o, u0: o.position, u1: o.position + o.width }))
          .sort((x, y) => x.u0 - y.u0);

        const addSlab = (u0, u1, y0, y1) => {
          if (u1 - u0 < 1e-4 || y1 - y0 < 1e-4) return;
          const m = box(u1 - u0, y1 - y0, t, MAT.wall);
          m.position.set(u0 + (u1 - u0) / 2 - len / 2, (y0 + y1) / 2, 0);
          m.castShadow = m.receiveShadow = true;
          grp.add(m);
        };

        let cursor = 0;
        for (const o of ops) {
          addSlab(cursor, o.u0, 0, H);
          const sill = o.sill_height || 0;
          const head = sill + o.height;
          if (sill > 0) addSlab(o.u0, o.u1, 0, sill);
          if (head < H) addSlab(o.u0, o.u1, head, H);
          buildOpening(o, grp, len, t);
          cursor = o.u1;
        }
        addSlab(cursor, len, 0, H);

        // Baseboard along the room-facing side.
        const bb = box(len, 0.11, 0.02, MAT.trim);
        bb.position.set(0, 0.055, -t / 2 - 0.01);
        grp.add(bb);

        // Record the wall as a plan-space blocker (for drag limits + walking).
        S.blockers.push(planRectOf(
          { x: (w.start.x + w.end.x) / 2, y: (w.start.y + w.end.y) / 2 },
          Math.abs(w.end.x - w.start.x) + t, Math.abs(w.end.y - w.start.y) + t, 0));
      }

      function buildOpening(o, grp, len, t) {
        const u = o.u0 + o.width / 2 - len / 2;
        const sill = o.sill_height || 0;
        const jamb = new THREE.Group();
        jamb.position.set(u, 0, 0);
        grp.add(jamb);

        const fw = 0.055;      // frame face width
        const fd = t + 0.03;   // frame depth
        // head + jambs + (for windows) the sill
        jamb.add(at(box(o.width + fw * 2, fw, fd, MAT.trim), 0, sill + o.height + fw / 2, 0));
        jamb.add(at(box(fw, o.height, fd, MAT.trim), -o.width / 2 - fw / 2, sill + o.height / 2, 0));
        jamb.add(at(box(fw, o.height, fd, MAT.trim),  o.width / 2 + fw / 2, sill + o.height / 2, 0));

        if (o.kind === "cased_opening") return;

        if (sill > 0) {
          const s = box(o.width + fw * 2 + 0.05, 0.035, t + 0.09, MAT.trim);
          s.position.set(0, sill - 0.017, -0.03);
          jamb.add(s);
          jamb.add(at(box(o.width + fw * 2, 0.09, 0.025, MAT.trim), 0, sill - 0.08, -t / 2 - 0.012));
        }

        // Glazing.
        const glass = box(o.width - 0.02, o.height - 0.02, 0.012, MAT.glass);
        glass.position.set(0, sill + o.height / 2, 0);
        jamb.add(glass);

        if (o.kind === "french_door") {
          // Single-lite door: white stiles and rails around a full glass panel.
          const st = 0.11;
          const dm = MAT.trim;
          jamb.add(at(box(st, o.height, 0.045, dm), -o.width / 2 + st / 2, o.height / 2, 0.02));
          jamb.add(at(box(st, o.height, 0.045, dm),  o.width / 2 - st / 2, o.height / 2, 0.02));
          jamb.add(at(box(o.width, 0.10, 0.045, dm), 0, o.height - 0.05, 0.02));
          jamb.add(at(box(o.width, 0.20, 0.045, dm), 0, 0.10, 0.02));
          jamb.add(at(box(o.width, 0.07, 0.045, dm), 0, 0.98, 0.02));
          const lever = cyl(0.012, 0.012, 0.10, MAT.nickel, 10);
          lever.rotation.z = Math.PI / 2;
          jamb.add(at(lever, o.width / 2 - 0.16, 1.02, -0.05));
        }

        // Roman shade covering the top fraction of the opening.
        if (o.shade) {
          const sh = box(o.width - 0.01, o.height * o.shade, 0.03, MAT.shade);
          sh.position.set(0, sill + o.height - (o.height * o.shade) / 2, -0.045);
          jamb.add(sh);
          jamb.add(at(box(o.width + 0.04, 0.045, 0.06, MAT.trim), 0, sill + o.height - 0.02, -0.05));
        }
      }

      // Sky dome + foliage + the balcony outside the French door, so the
      // windows read as looking somewhere rather than into a void.
      function buildExterior(parent) {
        const ex = S.schema.exterior || {};
        const skyTex = tex(16, 256, (g) => {
          const grd = g.createLinearGradient(0, 0, 0, 256);
          grd.addColorStop(0, ex.sky_top || "#9dc4e0");
          grd.addColorStop(0.60, ex.sky_bottom || "#e6eced");
          // Soft, wide horizon rather than a hard band — a crisp line reads as
          // a painted backdrop through the windows.
          grd.addColorStop(0.70, "#c3ccbd");
          grd.addColorStop(0.82, ex.foliage || "#7d9268");
          grd.addColorStop(1, "#6d8259");
          g.fillStyle = grd; g.fillRect(0, 0, 16, 256);
        });
        const dome = new THREE.Mesh(new THREE.SphereGeometry(70, 24, 16),
          new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide }));
        parent.add(dome);
        scene.fog = null;

        // Without an environment map every metal (stainless, nickel, the mirror
        // glass) has nothing to reflect and renders near-black. The sky gradient
        // doubles as a cheap IBL source.
        const pmrem = new THREE.PMREMGenerator(renderer);
        pmrem.compileEquirectangularShader();
        skyTex.mapping = THREE.EquirectangularReflectionMapping;
        scene.environment = pmrem.fromEquirectangular(skyTex).texture;
        scene.environmentIntensity = 0.85;
        pmrem.dispose();

        // Foliage clumps beyond the east window wall — these are what break
        // the flat gradient up into something that reads as outside.
        for (let i = 0; i < 30; i++) {
          const r = 0.8 + rnd() * 1.7;
          const shade = new THREE.Color(ex.foliage || "#7d9268").multiplyScalar(0.72 + rnd() * 0.55);
          const blob = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1),
            new THREE.MeshStandardMaterial({ color: shade, roughness: 0.92 }));
          blob.position.copy(toThree(S.W + 6.0 + rnd() * 12, rnd() * S.D * 1.5 - S.D * 0.25, 1.2 + rnd() * 3.6));
          blob.scale.set(1, 0.78, 1);
          parent.add(blob);
        }
        // A neighbouring facade across the way, as in the living-room views.
        const facade = box(7, 6.5, 0.3, new THREE.MeshStandardMaterial({ color: "#ddd6c6", roughness: 0.9 }));
        facade.position.copy(toThree(S.W + 19.0, S.D * 0.35, 3.2));
        facade.rotation.y = Math.PI / 2;
        parent.add(facade);

        const bal = ex.balcony;
        if (bal) {
          const o = S.schema.openings.find((x) => x.id === bal.at_opening);
          if (o) {
            const wall = S.schema.walls.find((w) => w.id === o.wall);
            const yc = wall.start.y + (o.position + o.width / 2) * Math.sign(wall.end.y - wall.start.y || 1);
            const deck = box(bal.depth, 0.06, bal.width, MAT.trim);
            deck.position.copy(toThree(S.W + bal.depth / 2, yc, -0.03));
            parent.add(deck);
            const rm = new THREE.MeshStandardMaterial({ color: bal.railing_color || "#2b2b2b", roughness: 0.62, metalness: 0.18 });
            const rail = new THREE.Group();
            rail.position.copy(toThree(S.W + bal.depth, yc, 0));
            for (let i = 0; i <= 14; i++) {
              const b = cyl(0.012, 0.012, bal.railing_height, rm, 8);
              b.position.set(0, bal.railing_height / 2, -bal.width / 2 + (i / 14) * bal.width);
              rail.add(b);
              if (i % 2 === 0 && i < 14) {  // scroll flourishes
                const t2 = new THREE.Mesh(new THREE.TorusGeometry(0.075, 0.009, 6, 16, Math.PI * 1.5), rm);
                t2.rotation.y = Math.PI / 2;
                t2.position.set(0, 0.5, -bal.width / 2 + (i / 14) * bal.width + bal.width / 28);
                rail.add(t2);
              }
            }
            const cap = box(0.05, 0.05, bal.width, rm);
            cap.position.set(0, bal.railing_height, 0);
            rail.add(cap);
            parent.add(rail);
          }
        }
      }

      /* ─────────────────────────── lighting ─────────────────────────── */
      function buildLights() {
        // Warm ambient stands in for interior bounce; without enough of it the
        // shadowed side of every wall and cabinet reads grey instead of beige.
        scene.add(new THREE.HemisphereLight(0xe8f0f7, 0xa08d72, 0.78));
        scene.add(new THREE.AmbientLight(0xfff3e2, 0.42));

        // Daylight raking in through the east window wall.
        const sun = new THREE.DirectionalLight(0xfff3e0, 2.05);
        sun.position.copy(toThree(S.W + 9, S.D * 0.42, 7.5));
        sun.target.position.copy(toThree(S.W * 0.35, S.D * 0.45, 0.6));
        scene.add(sun, sun.target);
        sun.castShadow = true;
        const sc = sun.shadow.camera;
        const span = Math.max(S.W, S.D) * 0.72;
        sc.left = -span; sc.right = span; sc.top = span; sc.bottom = -span;
        sc.near = 1; sc.far = 40;
        sun.shadow.mapSize.set(2048, 2048);
        sun.shadow.bias = -0.0006;
        sun.shadow.normalBias = 0.022;

        // A soft fill from the kitchen end so the north half isn't muddy.
        const fill = new THREE.DirectionalLight(0xf6efe2, 0.5);
        fill.position.copy(toThree(S.W * 0.4, S.D + 4, 5));
        scene.add(fill);

        // Floor bounce back up onto the west wall and cabinet faces.
        const bounce = new THREE.DirectionalLight(0xffeed6, 0.34);
        bounce.position.copy(toThree(-4, S.D * 0.5, 1.2));
        scene.add(bounce);
      }

      /* ─────────────────────────── furniture builders ────────────────── */
      // Every builder returns a group whose origin is the object's plan
      // centre with y = 0 at its base, authored facing local +z.
      const B = {};

      B.sofa = (o) => {
        const { w, d, h } = o.size;
        const g = new THREE.Group();
        const body = fabricMat(o.colors?.body || "#8b8d93", 0.88);
        // Cushions read a touch lighter than the frame, which is what gives
        // the silhouette its seams at a distance.
        const cushHex = o.colors?.cushion ||
          "#" + new THREE.Color(o.colors?.body || "#8b8d93").multiplyScalar(1.12).getHexString();
        const cush = fabricMat(cushHex, 0.86);
        g.add(at(box(w, 0.24, d, body), 0, 0.12, 0));
        g.add(at(box(w, h - 0.32, 0.17, body), 0, 0.24 + (h - 0.32) / 2, -d / 2 + 0.085));
        // Rolled top rail — a hard-edged slab is what makes a sofa read as a box.
        const backRoll = cyl(0.085, 0.085, w, body, 16);
        backRoll.rotation.z = Math.PI / 2;
        g.add(at(backRoll, 0, h - 0.085, -d / 2 + 0.085));
        for (const s of [-1, 1]) {
          g.add(at(box(0.17, h - 0.38, d - 0.04, body), s * (w / 2 - 0.085), 0.24 + (h - 0.38) / 2, 0.02));
          const armRoll = cyl(0.085, 0.085, d - 0.04, body, 16);
          armRoll.rotation.x = Math.PI / 2;
          g.add(at(armRoll, s * (w / 2 - 0.085), h - 0.155, 0.02));
        }
        const n = Math.max(2, Math.round((w - 0.34) / 0.74));
        const cw = (w - 0.34) / n;
        for (let i = 0; i < n; i++) {
          const x = -w / 2 + 0.17 + cw * (i + 0.5);
          g.add(at(box(cw - 0.025, 0.17, d - 0.28, cush), x, 0.325, 0.055));
          const roll = cyl(0.085, 0.085, cw - 0.025, cush, 14);
          roll.rotation.z = Math.PI / 2;
          g.add(at(roll, x, 0.325, 0.055 + (d - 0.28) / 2));
          const bc = box(cw - 0.045, h - 0.60, 0.16, cush);
          bc.position.set(x, 0.41 + (h - 0.60) / 2, -d / 2 + 0.20);
          bc.rotation.x = -0.09;
          g.add(bc);
        }
        for (const sx of [-1, 1]) for (const sz of [-1, 1])
          g.add(at(cyl(0.026, 0.02, 0.09, MAT.wood, 8), sx * (w / 2 - 0.10), 0.045, sz * (d / 2 - 0.10)));
        return g;
      };

      B.armchair = (o) => {
        const { w, d, h } = o.size;
        const g = new THREE.Group();
        const body = fabricMat(o.colors?.body || "#6f737b", 0.87);
        g.add(at(box(w, 0.26, d, body), 0, 0.13, 0));
        g.add(at(box(w, h - 0.34, 0.16, body), 0, 0.26 + (h - 0.34) / 2, -d / 2 + 0.08));
        const chBackRoll = cyl(0.08, 0.08, w, body, 16);
        chBackRoll.rotation.z = Math.PI / 2;
        g.add(at(chBackRoll, 0, h - 0.08, -d / 2 + 0.08));
        for (const s of [-1, 1]) {
          g.add(at(box(0.15, h - 0.42, d - 0.05, body), s * (w / 2 - 0.075), 0.26 + (h - 0.42) / 2, 0.02));
          const ar = cyl(0.075, 0.075, d - 0.05, body, 16);
          ar.rotation.x = Math.PI / 2;
          g.add(at(ar, s * (w / 2 - 0.075), h - 0.155, 0.02));
        }
        g.add(at(box(w - 0.30, 0.16, d - 0.24, body), 0, 0.34, 0.045));
        const seatRoll = cyl(0.08, 0.08, w - 0.30, body, 14);
        seatRoll.rotation.z = Math.PI / 2;
        g.add(at(seatRoll, 0, 0.34, 0.045 + (d - 0.24) / 2));
        const bc = box(w - 0.32, h - 0.56, 0.14, body);
        bc.position.set(0, 0.42 + (h - 0.56) / 2, -d / 2 + 0.19);
        bc.rotation.x = -0.1; g.add(bc);
        // nailhead trim along the front rail
        for (let i = 0; i < 9; i++)
          g.add(at(new THREE.Mesh(new THREE.SphereGeometry(0.009, 8, 6), MAT.nickel),
            -w / 2 + 0.10 + i * ((w - 0.20) / 8), 0.20, d / 2 + 0.005));
        for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
          const l = cyl(0.022, 0.016, 0.13, MAT.wood, 8);
          g.add(at(l, sx * (w / 2 - 0.08), 0.065, sz * (d / 2 - 0.08)));
        }
        return g;
      };

      B.ottoman_bench = (o) => {
        const { w, d, h } = o.size;
        const g = new THREE.Group();
        const top = fabricMat(o.colors?.body || "#ddd4c3", 0.86);
        g.add(at(box(w, 0.16, d, top), 0, h - 0.08, 0));
        // tufting dimples
        for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++)
          g.add(at(new THREE.Mesh(new THREE.SphereGeometry(0.02, 8, 6), top),
            -w / 3 + i * (w / 3), h - 0.005, -d / 5 + j * (d / 2.5)));
        const fr = new THREE.MeshStandardMaterial({ color: o.colors?.frame || "#3a2a24", roughness: 0.44 });
        g.add(at(box(w - 0.04, 0.05, d - 0.04, fr), 0, h - 0.185, 0));
        for (const sx of [-1, 1]) for (const sz of [-1, 1])
          g.add(at(cyl(0.026, 0.018, h - 0.21, fr, 8), sx * (w / 2 - 0.07), (h - 0.21) / 2, sz * (d / 2 - 0.07)));
        // tray + book, as in the photos
        g.add(at(box(0.42, 0.03, 0.30, fr), 0.06, h + 0.015, 0));
        g.add(at(box(0.17, 0.035, 0.24, new THREE.MeshStandardMaterial({ color: "#2f3a5c", roughness: 0.7 })),
          -0.24, h + 0.018, 0.02));
        const cone = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.11, 14), MAT.wood);
        g.add(at(cone, 0.10, h + 0.085, 0));
        return g;
      };

      B.rug = (o) => {
