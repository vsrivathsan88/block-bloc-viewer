        const { w, h } = o.size;
        const g = new THREE.Group();
        const m = new THREE.MeshStandardMaterial({ color: o.colors?.metal || "#8d8b86", roughness: 0.32, metalness: 0.72 });
        g.add(at(cyl(0.07, 0.07, 0.03, m, 18), 0, -0.015, 0));
        g.add(at(cyl(0.008, 0.008, h - 0.30, m, 8), 0, -(h - 0.30) / 2, 0));
        const hub = -(h - 0.28);
        g.add(at(cyl(0.05, 0.075, 0.10, m, 18), 0, hub, 0));
        for (let i = 0; i < 3; i++) {
          const a = (i / 3) * Math.PI * 2;
          const arm = cyl(0.011, 0.011, w * 0.52, m, 8);
          arm.rotation.z = Math.PI / 2 - 0.5;
          arm.rotation.y = a;
          arm.position.set(Math.cos(a) * w * 0.22, hub - 0.06, Math.sin(a) * w * 0.22);
          g.add(arm);
          const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.035, 0.11, 20, 1, true), MAT.shadeGlass);
          cup.position.set(Math.cos(a) * w * 0.46, hub - 0.16, Math.sin(a) * w * 0.46);
          g.add(cup);
          g.add(at(new THREE.Mesh(new THREE.SphereGeometry(0.028, 10, 8), MAT.bulb),
            Math.cos(a) * w * 0.46, hub - 0.15, Math.sin(a) * w * 0.46));
        }
        const pl = new THREE.PointLight(0xffe6bd, 9, 6, 2);
        pl.position.set(0, hub - 0.18, 0);
        g.add(pl);
        return g;
      };

      B.ceiling_fan = (o) => {
        const { w, h } = o.size;
        const g = new THREE.Group();
        const bm = new THREE.MeshStandardMaterial({ color: o.colors?.body || "#9a9893", roughness: 0.3, metalness: 0.72 });
        g.add(at(cyl(0.085, 0.085, 0.03, bm, 18), 0, -0.015, 0));
        g.add(at(cyl(0.022, 0.022, h * 0.52, bm, 10), 0, -h * 0.26, 0));
        const hubY = -h * 0.52;
        g.add(at(cyl(0.11, 0.135, 0.11, bm, 22), 0, hubY - 0.055, 0));
        g.add(at(cyl(0.135, 0.10, 0.05, bm, 22), 0, hubY - 0.13, 0));
        const blm = new THREE.MeshStandardMaterial({ color: o.colors?.blades || "#4a2f24", roughness: 0.45 });
        const bl = w / 2 - 0.13;
        for (let i = 0; i < 5; i++) {
          const a = (i / 5) * Math.PI * 2;
          const arm = new THREE.Group();
          arm.rotation.y = a;
          const blade = box(bl, 0.014, 0.20, blm);
          blade.position.set(0.13 + bl / 2, hubY - 0.09, 0);
          blade.rotation.z = 0.13;
          arm.add(blade);
          arm.add(at(box(0.14, 0.012, 0.07, bm), 0.12, hubY - 0.075, 0));
          g.add(arm);
        }
        if (o.light_kit) {
          const gl = new THREE.Mesh(new THREE.SphereGeometry(0.12, 20, 14, 0, Math.PI * 2, Math.PI * 0.42, Math.PI * 0.58), MAT.shadeGlass);
          gl.position.set(0, hubY - 0.19, 0);
          g.add(gl);
          g.add(at(new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 10), MAT.bulb), 0, hubY - 0.21, 0));
          const pl = new THREE.PointLight(0xffe9c6, 7, 6.5, 2);
          pl.position.set(0, hubY - 0.22, 0);
          g.add(pl);
        }
        return g;
      };

      B.downlight_array = (o) => {
        const g = new THREE.Group();
        const cols = o.cols || 3, rows = o.rows || 2;
        const rim = new THREE.MeshStandardMaterial({ color: "#efece5", roughness: 0.5 });
        for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
          const x = cols === 1 ? 0 : -o.size.w / 2 + (i / (cols - 1)) * o.size.w;
          const z = rows === 1 ? 0 : -o.size.d / 2 + (j / (rows - 1)) * o.size.d;
          g.add(at(cyl(0.075, 0.075, 0.012, rim, 20), x, -0.006, z));
          g.add(at(cyl(0.058, 0.058, 0.008, MAT.bulb, 20), x, -0.014, z));
        }
        return g;
      };

      B.ceiling_vent = (o) => {
        const g = new THREE.Group();
        const { w, d } = o.size;
        g.add(at(box(w, 0.012, d, MAT.trim), 0, -0.006, 0));
        for (let i = 0; i < 5; i++)
          g.add(at(box(w - 0.05, 0.006, 0.014, MAT.dark), 0, -0.014, -d / 2 + 0.03 + i * ((d - 0.06) / 4)));
        return g;
      };

      B.decor_vase = (o) => {
        const g = new THREE.Group();
        const { w, h } = o.size;
        const m = new THREE.MeshStandardMaterial({ color: o.colors?.body || "#8fc7ae",
          roughness: 0.12, metalness: 0.1, transparent: true, opacity: 0.62 });
        g.add(at(cyl(w / 2 * 0.55, w / 2, h * 0.7, m, 20), 0, h * 0.35, 0));
        g.add(at(cyl(w / 2 * 0.42, w / 2 * 0.5, h * 0.3, m, 20), 0, h * 0.85, 0));
        return g;
      };
      B.decor_bottle = (o) => {
        const g = new THREE.Group();
        const { w, h } = o.size;
        const m = new THREE.MeshStandardMaterial({ color: o.colors?.body || "#b7bfb8",
          roughness: 0.14, metalness: 0.35, transparent: true, opacity: 0.7 });
        g.add(at(cyl(w / 2 * 0.85, w / 2, h * 0.62, m, 18), 0, h * 0.31, 0));
        g.add(at(cyl(w / 2 * 0.3, w / 2 * 0.55, h * 0.34, m, 14), 0, h * 0.79, 0));
        g.add(at(cyl(w / 2 * 0.34, w / 2 * 0.30, 0.02, MAT.wood, 14), 0, h * 0.97, 0));
        return g;
      };
      B.decor_sphere = (o) => {
        const g = new THREE.Group();
        const r = o.size.w / 2;
        g.add(at(new THREE.Mesh(new THREE.SphereGeometry(r, 22, 16),
          new THREE.MeshStandardMaterial({ color: o.colors?.body || "#c8c2b4", roughness: 0.18, metalness: 0.85 })), 0, r, 0));
        g.add(at(cyl(r * 0.6, r * 0.7, 0.02, MAT.wood, 16), 0, 0.01, 0));
        return g;
      };
      B.decor_cloche = (o) => {
        const g = new THREE.Group();
        const { w, h } = o.size, r = w / 2;
        g.add(at(cyl(r * 1.15, r * 1.2, 0.025, MAT.wood, 20), 0, 0.012, 0));
        const dome = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 14, 0, Math.PI * 2, 0, Math.PI / 2),
          new THREE.MeshStandardMaterial({ color: "#cfd6d8", roughness: 0.06, metalness: 0.2,
            transparent: true, opacity: 0.28, side: THREE.DoubleSide }));
        dome.position.y = h - r;
        g.add(dome);
        g.add(at(cyl(r, r, h - r, dome.material, 20), 0, (h - r) / 2 + 0.012, 0));
        // small dark figurine inside
        g.add(at(box(0.045, 0.075, 0.03, MAT.wood), 0, 0.055, 0));
        g.add(at(new THREE.Mesh(new THREE.SphereGeometry(0.025, 10, 8), MAT.wood), 0.01, 0.105, 0.01));
        return g;
      };

      B.stair_run = (o) => {
        const { w, d, h } = o.size;
        const n = o.risers || 14;
        const rise = h / n, going = d / (n - 1);
        const g = new THREE.Group();
        const cm = new THREE.MeshStandardMaterial({ map: softTex(o.colors?.carpet || "#a3937d", 0.2, "70,55,38"), roughness: 0.95 });
        const rm = new THREE.MeshStandardMaterial({ color: o.colors?.riser || "#f2efe9", roughness: 0.6 });
        // Ascends toward local -z (schema north), bottom step at local +z.
        for (let i = 0; i < n; i++) {
          const z = d / 2 - i * going;
          const y = i * rise;
          const tr = box(w, 0.05, going + 0.03, cm);
          tr.position.set(0, y + rise - 0.025, z - going / 2);
          tr.castShadow = tr.receiveShadow = true;
          g.add(tr);
          g.add(at(box(w, rise, 0.03, rm), 0, y + rise / 2, z - going + 0.015));
        }
        // stringer / skirt on the open (local +x) side
        const skirt = box(0.03, 0.30, Math.hypot(d, h), rm);
        skirt.position.set(w / 2 + 0.015, h / 2 + 0.04, 0);
        skirt.rotation.x = Math.atan2(h, d);
        g.add(skirt);
        // handrail + balusters on the open side
        const hm = new THREE.MeshStandardMaterial({ color: o.colors?.rail || "#5d3a28", roughness: 0.35 });
        const bm = new THREE.MeshStandardMaterial({ color: o.colors?.baluster || "#f6f3ee", roughness: 0.5 });
        const slope = Math.atan2(h, d);
        const rail = box(0.06, 0.05, Math.hypot(d, h) + 0.10, hm);
        rail.position.set(w / 2 + 0.02, h / 2 + 0.92, 0);
        rail.rotation.x = slope;
        g.add(rail);
        const nb = Math.floor(d / 0.13);
        for (let i = 1; i < nb; i++) {
          const t = i / nb;
          const z = d / 2 - t * d;
          const yb = t * h;
          const b = box(0.032, 0.92, 0.032, bm);
          b.position.set(w / 2 + 0.02, yb + 0.46, z);
          g.add(b);
        }
        const newel = box(0.09, 1.06, 0.09, bm);
        newel.position.set(w / 2 + 0.02, 0.53, d / 2 + 0.04);
        g.add(newel);
        g.add(at(box(0.115, 0.05, 0.115, hm), w / 2 + 0.02, 1.08, d / 2 + 0.04));
        return g;
      };

      /* ─────────────────────── plan-space geometry helpers ───────────── */
      function planRectOf(pos, w, d, rotDeg) {
        const th = (rotDeg || 0) * D2R;
        const c = Math.abs(Math.cos(th)), s = Math.abs(Math.sin(th));
        const ew = (w * c + d * s) / 2, ed = (w * s + d * c) / 2;
        return { minx: pos.x - ew, maxx: pos.x + ew, miny: pos.y - ed, maxy: pos.y + ed };
      }
      const rectOf = (rec) => planRectOf(rec.position, rec.size.w, rec.size.d, rec.rotation_deg);
      const overlaps = (a, b, pad = 0) =>
        a.minx < b.maxx - pad && a.maxx > b.minx + pad && a.miny < b.maxy - pad && a.maxy > b.miny + pad;
      // Only same-level floor items block each other; rugs and props on top don't.
      const isFloorSolid = (r) =>
        (r.mount || "floor") === "floor" && !(r.elevation > 0.02) && r.type !== "rug" && !r.hidden;

      /* ─────────────────────────── build objects ────────────────────── */
      // Looking straight down, fans and pendants cover the furniture they hang
      // over, so plan view drops them — unless one is selected, so it can still
      // be repositioned after being picked from the list.
      const showInMode = (id, rec) =>
        !rec.hidden && !(S.mode === "plan" && rec.mount === "ceiling" && S.sel !== id);

      function placeGroup(id) {
        const rec = S.recs.get(id), g = S.groups.get(id);
        if (!g) return;
        const y = rec.mount === "ceiling" ? S.H : (rec.elevation || 0);
        g.position.copy(toThree(rec.position.x, rec.position.y, y));
        g.rotation.y = -rec.rotation_deg * D2R;
        g.visible = showInMode(id, rec);
      }
      const syncVisibility = () => { for (const id of S.recs.keys()) placeGroup(id); };

      function buildObjects() {
        for (const o of S.schema.objects) {
          const rec = {
            ...o,
            position: { ...o.position },
            elevation: o.elevation || 0,
            mount: o.mount || "floor",
            hidden: false,
          };
          S.recs.set(o.id, rec);
          S.base.set(o.id, { x: rec.position.x, y: rec.position.y, rot: rec.rotation_deg, elev: rec.elevation });

          const make = B[o.type];
          if (!make) { console.warn("no builder for type", o.type); continue; }
          const g = make(rec);
          g.traverse((m) => {
            if (!m.isMesh) return;
            m.castShadow = true;
            m.receiveShadow = true;
            m.userData.oid = o.id;
          });
          addContactShadow(g, rec);   // after the traverse — it must not cast
          g.userData.oid = o.id;
          S.groups.set(o.id, g);
          S.items.add(g);
          placeGroup(o.id);

          if (rec.movable === false && isFloorSolid(rec)) S.blockers.push(rectOf(rec));
        }

        // Decor riding on a host surface moves with it.
        for (const o of S.schema.objects) {
          if (!o.on) continue;
          const host = S.recs.get(o.on);
          if (!host) continue;
          const arr = S.children.get(o.on) || [];
          arr.push({ id: o.id, dx: o.position.x - host.position.x, dy: o.position.y - host.position.y });
          S.children.set(o.on, arr);
        }

        buildPlanLabels();
      }

      function buildPlanLabels() {
        for (const [id, rec] of S.recs) {
          if (rec.movable === false || rec.on) continue;   // props label their host instead
          const c = document.createElement("canvas");
          c.width = 256; c.height = 44;
          const g = c.getContext("2d");
          g.fillStyle = "rgba(12,13,18,.78)";
          g.beginPath(); g.roundRect(0, 0, 256, 44, 10); g.fill();
          g.fillStyle = "#e9e9f2"; g.font = "600 22px -apple-system, sans-serif";
          g.textAlign = "center"; g.textBaseline = "middle";
          g.fillText(rec.label.slice(0, 24), 128, 23);
          const t = new THREE.CanvasTexture(c);
          t.colorSpace = THREE.SRGBColorSpace;
          const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false, transparent: true }));
          sp.scale.set(0.9, 0.155, 1);
          sp.userData.oid = id;
          S.labels.add(sp);
        }
        S.labels.visible = false;
      }
      function syncLabels() {
        for (const sp of S.labels.children) {
          const rec = S.recs.get(sp.userData.oid);
          sp.visible = showInMode(sp.userData.oid, rec);
          sp.position.copy(toThree(rec.position.x, rec.position.y, 2.2));
        }
      }

      /* ─────────────────────────── selection outline ─────────────────── */
      const outline = new THREE.LineSegments(
        new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1)),
        new THREE.LineBasicMaterial({ color: 0x7fb2e5, depthTest: false, transparent: true }));
      outline.renderOrder = 999;
      outline.visible = false;
      scene.add(outline);
      const pad = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
        new THREE.MeshBasicMaterial({ color: 0x7fb2e5, transparent: true, opacity: 0.16, depthWrite: false }));
      pad.rotation.x = -Math.PI / 2;
      pad.visible = false;
      scene.add(pad);

      function syncOutline() {
        if (!S.sel) { outline.visible = pad.visible = false; return; }
        const rec = S.recs.get(S.sel);
        const r = rectOf(rec);
        const w = r.maxx - r.minx, d = r.maxy - r.miny;
        const h = Math.max(rec.size.h, 0.05);
        const baseY = rec.mount === "ceiling" ? S.H - h : (rec.elevation || 0);
        const c = toThree((r.minx + r.maxx) / 2, (r.miny + r.maxy) / 2, baseY + h / 2);
        outline.position.copy(c);
        outline.scale.set(w, h, d);
        outline.visible = !rec.hidden;
        pad.position.set(c.x, 0.012, c.z);
        pad.scale.set(w, d, 1);
        pad.visible = !rec.hidden && rec.mount === "floor";
        const bad = S.drag && !S.drag.valid;
        outline.material.color.set(bad ? 0xe58b7f : 0x7fb2e5);
        pad.material.color.set(bad ? 0xe58b7f : 0x7fb2e5);
      }

      /* ─────────────────────────── interaction ──────────────────────── */
      const ray = new THREE.Raycaster();
      const ndc = new THREE.Vector2();
      const dragPlane = new THREE.Plane();
      const hitPt = new THREE.Vector3();
      const SNAP = 0.07;

      function setNdc(e) {
        ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
      }
      function pick(e) {
        setNdc(e);
        ray.setFromCamera(ndc, camera);
        const ids = [];
        for (const h of ray.intersectObjects(S.items.children, true)) {
          let o = h.object;
          while (o && !o.userData.oid) o = o.parent;
          if (!o) continue;
          const rec = S.recs.get(o.userData.oid);
          if (!rec || rec.hidden || ids.includes(o.userData.oid)) continue;
          ids.push(o.userData.oid);
        }
        if (!ids.length) return null;
        if (S.mode === "plan") {
          // Straight down, ceiling fixtures sit in front of everything else.
          // Clicks fall through to the furniture below — but a fixture stays
          // draggable once it's been selected (from the list, or by clicking a
          // part of it that overhangs nothing).
          if (S.sel && ids.includes(S.sel) && S.recs.get(S.sel).mount === "ceiling") return S.sel;
          const below = ids.find((id) => S.recs.get(id).mount !== "ceiling");
          if (below) return below;
        }
        return ids[0];
      }

      renderer.domElement.addEventListener("pointerdown", (e) => {
        if (S.mode === "walk" || e.button !== 0) return;
        const id = pick(e);
        if (!id) { select(null); return; }
        select(id);
        const rec = S.recs.get(id);
        if (rec.movable === false) return;

        const y = rec.mount === "ceiling" ? S.H : (rec.elevation || 0);
        dragPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, y, 0));
        ray.setFromCamera(ndc, camera);
        if (!ray.ray.intersectPlane(dragPlane, hitPt)) return;
        S.drag = {
          id,
          grabX: hitPt.x - toThree(rec.position.x, rec.position.y, 0).x,
          grabZ: hitPt.z - toThree(rec.position.x, rec.position.y, 0).z,
          from: { x: rec.position.x, y: rec.position.y },
          valid: true,
        };
        S.lastValid = { x: rec.position.x, y: rec.position.y };
        controls.enabled = false; planControls.enabled = false;
        renderer.domElement.setPointerCapture(e.pointerId);
      });

      renderer.domElement.addEventListener("pointermove", (e) => {
        if (!S.drag) return;
        setNdc(e);
        ray.setFromCamera(ndc, camera);
        if (!ray.ray.intersectPlane(dragPlane, hitPt)) return;
        const rec = S.recs.get(S.drag.id);
        // Undo the schema→three mapping to get back to plan coordinates.
        let px = hitPt.x - S.drag.grabX + S.cx;
        let py = -(hitPt.z - S.drag.grabZ) + S.cy;

        const snapped = applySnap(rec, px, py, e.shiftKey);
        px = snapped.x; py = snapped.y;

        moveTo(S.drag.id, px, py);
        S.drag.valid = isPoseValid(rec);
        if (S.drag.valid) S.lastValid = { x: px, y: py };
        syncOutline(); syncInspector();
      });

      addEventListener("pointerup", () => {
        if (!S.drag) return;
        const rec = S.recs.get(S.drag.id);
        if (!S.drag.valid && S.lastValid) moveTo(S.drag.id, S.lastValid.x, S.lastValid.y);
        S.drag = null;
        controls.enabled = S.mode === "orbit";
        planControls.enabled = S.mode === "plan";
        syncOutline(); syncInspector();
      });

      // Snap the dragged footprint to walls and to other objects' edges.
      function applySnap(rec, px, py, off) {
        if (off) return { x: px, y: py };
        const r = planRectOf({ x: px, y: py }, rec.size.w, rec.size.d, rec.rotation_deg);
        const hw = (r.maxx - r.minx) / 2, hd = (r.maxy - r.miny) / 2;
        const xs = [0, S.W], ys = [0, S.D];
        for (const w of S.schema.walls) {
          if (w.start.x === w.end.x) xs.push(w.start.x - w.thickness / 2, w.start.x + w.thickness / 2);
          if (w.start.y === w.end.y) ys.push(w.start.y - w.thickness / 2, w.start.y + w.thickness / 2);
        }
        for (const [id, o] of S.recs) {
          if (id === rec.id || o.hidden || !isFloorSolid(o)) continue;
          const q = rectOf(o);
          xs.push(q.minx, q.maxx); ys.push(q.miny, q.maxy);
        }
        let bx = null, by = null;
        for (const t of xs) {
          for (const edge of [r.minx, r.maxx]) {
            const dd = t - edge;
            if (Math.abs(dd) < SNAP && (bx === null || Math.abs(dd) < Math.abs(bx))) bx = dd;
          }
        }
        for (const t of ys) {
          for (const edge of [r.miny, r.maxy]) {
            const dd = t - edge;
            if (Math.abs(dd) < SNAP && (by === null || Math.abs(dd) < Math.abs(by))) by = dd;
          }
        }
        return { x: px + (bx || 0), y: py + (by || 0) };
      }

      function isPoseValid(rec) {
        const r = rectOf(rec);
        if (r.minx < -0.02 || r.maxx > S.W + 0.02 || r.miny < -0.02 || r.maxy > S.D + 0.02) return false;
        if (!isFloorSolid(rec)) return true;
        for (const b of S.blockers) if (overlaps(r, b, 0.02)) return false;
        for (const [id, o] of S.recs) {
          if (id === rec.id || !isFloorSolid(o) || o.movable === false) continue;
          // Objects sharing a collision_group pass through each other. Chairs
          // tuck under their table, which in plan is an overlap — without this
          // a dining set can never be pushed back in once it's been pulled out.
          if (rec.collision_group && rec.collision_group === o.collision_group) continue;
          if (overlaps(r, rectOf(o), 0.03)) return false;
        }
        return true;
      }

      function moveTo(id, x, y) {
        const rec = S.recs.get(id);
        const dx = x - rec.position.x, dy = y - rec.position.y;
        rec.position.x = x; rec.position.y = y;
        placeGroup(id);
        for (const c of S.children.get(id) || []) {
          const cr = S.recs.get(c.id);
          cr.position.x += dx; cr.position.y += dy;
          placeGroup(c.id);
        }
      }

      function rotate(id, deg) {
        const rec = S.recs.get(id);
        rec.rotation_deg = ((rec.rotation_deg + deg) % 360 + 360) % 360;
        placeGroup(id);
        for (const c of S.children.get(id) || []) {
          const cr = S.recs.get(c.id);
          cr.rotation_deg = ((cr.rotation_deg + deg) % 360 + 360) % 360;
          placeGroup(c.id);
        }
        if (!isPoseValid(rec)) { toast("won't fit at that angle"); rec.rotation_deg = ((rec.rotation_deg - deg) % 360 + 360) % 360; placeGroup(id); }
        syncOutline(); syncInspector();
      }

      function select(id) {
        S.sel = id;
        syncVisibility();
        syncOutline(); syncInspector(); syncList();
      }

      addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
        if (e.code === "Escape" && S.mode !== "walk") { select(null); return; }
        if (S.mode === "walk") return;
        if (!S.sel) return;
        const rec = S.recs.get(S.sel);
        if (rec.movable === false) return;
        const step = e.shiftKey ? 5 : 15;
        if (e.code === "KeyQ") { rotate(S.sel, -step); e.preventDefault(); }
        if (e.code === "KeyE") { rotate(S.sel, step); e.preventDefault(); }
        if (e.code === "Delete" || e.code === "Backspace") { toggleHidden(S.sel); e.preventDefault(); }
        if (e.code === "ArrowUp" || e.code === "ArrowDown") {
          if (rec.mount === "wall" || rec.elevation > 0) {
            rec.elevation = Math.max(0, Math.min(S.H - rec.size.h, rec.elevation + (e.code === "ArrowUp" ? 0.05 : -0.05)));
            placeGroup(S.sel); syncOutline(); syncInspector();
          }
          e.preventDefault();
        }
      });

      function toggleHidden(id) {
        const rec = S.recs.get(id);
        rec.hidden = !rec.hidden;
        placeGroup(id);
        for (const c of S.children.get(id) || []) {
          S.recs.get(c.id).hidden = rec.hidden;
          placeGroup(c.id);
        }
        syncOutline(); syncList(); syncInspector();
      }

      /* ─────────────────────────── UI ───────────────────────────────── */
      function syncList() {
        const el = $("#side");
        el.innerHTML = "";
        for (const z of S.schema.zones) {
          const ids = [...S.recs.entries()]
            .filter(([, r]) => !r.on && r.position.x >= z.min.x && r.position.x <= z.max.x
              && r.position.y >= z.min.y && r.position.y <= z.max.y)
            .map(([id]) => id);
          if (!ids.length) continue;
          const d = document.createElement("div");
          d.className = "zone";
          d.innerHTML = `<div class="zname">${z.label}</div>`;
          for (const id of ids) {
            const r = S.recs.get(id);
            const row = document.createElement("div");
            row.className = "row" + (r.movable === false ? " fixed" : "") +
              (S.sel === id ? " sel" : "") + (r.hidden ? " off" : "");
            const col = r.colors?.body || r.colors?.top || r.colors?.blades || "#8a8f98";
            row.innerHTML = `<span class="sw" style="background:${col}"></span><span>${r.label}</span>`;
            if (r.movable !== false) row.onclick = () => select(id);
            d.appendChild(row);
          }
          el.appendChild(d);
        }
      }

      function syncInspector() {
        const el = $("#insp");
        if (!S.sel) { el.classList.remove("show"); return; }
        el.classList.add("show");
        const r = S.recs.get(S.sel);
        $("#i-name").textContent = r.label + (r.hidden ? "  (hidden)" : "");
        $("#i-meta").textContent =
          `${r.size.w.toFixed(2)} × ${r.size.d.toFixed(2)} × ${r.size.h.toFixed(2)} m` +
          `   ·   x ${r.position.x.toFixed(2)}  y ${r.position.y.toFixed(2)}  ${Math.round(r.rotation_deg)}°` +
          (r.elevation ? `  ·  +${r.elevation.toFixed(2)} m` : "");
        el.querySelector('[data-act="hide"]').textContent = r.hidden ? "show" : "hide";
      }
      $("#insp").addEventListener("click", (e) => {
        const a = e.target.dataset.act;
        if (!a || !S.sel) return;
        if (a === "rot-ccw") rotate(S.sel, -15);
        if (a === "rot-cw") rotate(S.sel, 15);
        if (a === "hide") toggleHidden(S.sel);
        if (a === "reset") {
          const b = S.base.get(S.sel), rec = S.recs.get(S.sel);
          rec.rotation_deg = b.rot; rec.elevation = b.elev; rec.hidden = false;
          moveTo(S.sel, b.x, b.y);
          syncOutline(); syncInspector(); syncList();
        }
      });

      let toastT = null;
      function toast(msg) {
        const t = $("#toast");
        t.textContent = msg; t.classList.add("show");
        clearTimeout(toastT);
        toastT = setTimeout(() => t.classList.remove("show"), 1900);
      }

      /* ─────────────────────────── modes ───────────────────────────── */
      const walk = { on: false, yaw: 0, pitch: 0, keys: new Set(), pos: new THREE.Vector3() };

      function setMode(m) {
        S.mode = m;
        for (const b of document.querySelectorAll("#modes button[data-mode]"))
          b.classList.toggle("on", b.dataset.mode === m);
        controls.enabled = m === "orbit";
        planControls.enabled = m === "plan";
        S.labels.visible = m === "plan";
        syncVisibility();
        $("#lock").classList.toggle("show", m === "walk" && !walk.on);
        const hm = $("#help-mode");

        if (m === "orbit") {
          camera = persp;
          persp.fov = 50; persp.updateProjectionMatrix();
          // Doll-house view from beyond the north-east corner. The ceiling plane
          // faces down, so its back face culls and the whole floor is readable
          // from above without hiding anything.
          persp.position.copy(toThree(S.W * 0.5, -5.6, 10.6));
          controls.target.copy(toThree(S.W * 0.5, S.D * 0.5, 0.3));
          controls.update();
          hm.innerHTML = "3D: <kbd>drag</kbd> orbit · <kbd>scroll</kbd> zoom · <kbd>right-drag</kbd> pan";
        } else if (m === "plan") {
          camera = ortho;
          fitOrtho();
          ortho.position.copy(toThree(S.W / 2, S.D / 2, 30));
          ortho.up.set(0, 0, -1);
          ortho.lookAt(toThree(S.W / 2, S.D / 2, 0));
          planControls.target.copy(toThree(S.W / 2, S.D / 2, 0));
          planControls.update();
          hm.innerHTML = "plan: <kbd>drag</kbd> move items · <kbd>right-drag</kbd> pan · <kbd>scroll</kbd> zoom";
        } else {
          camera = persp;
          persp.fov = 72; persp.updateProjectionMatrix();
          walk.pos.copy(toThree(S.W * 0.55, 3.4, 1.62));
          walk.yaw = Math.PI; walk.pitch = -0.04;
          applyWalk();
          hm.innerHTML = "walk: <kbd>WASD</kbd> move · <kbd>⇧</kbd> run · <kbd>Esc</kbd> release";
        }
        onResize();
      }
      for (const b of document.querySelectorAll("#modes button[data-mode]"))
        b.onclick = () => setMode(b.dataset.mode);

      function fitOrtho() {
        const aspect = innerWidth / innerHeight;
        const m = 0.7;
        let hw = S.W / 2 + m, hh = S.D / 2 + m;
        if (hw / hh < aspect) hw = hh * aspect; else hh = hw / aspect;
        ortho.left = -hw; ortho.right = hw; ortho.top = hh; ortho.bottom = -hh;
        ortho.updateProjectionMatrix();
      }

      $("#lock").onclick = () => renderer.domElement.requestPointerLock();
      document.addEventListener("pointerlockchange", () => {
        walk.on = document.pointerLockElement === renderer.domElement;
        $("#lock").classList.toggle("show", S.mode === "walk" && !walk.on);
      });
      addEventListener("mousemove", (e) => {
        if (!walk.on) return;
        walk.yaw -= e.movementX * 0.0023;
        walk.pitch = Math.max(-1.48, Math.min(1.48, walk.pitch - e.movementY * 0.0023));
      });
      addEventListener("keydown", (e) => { if (S.mode === "walk") walk.keys.add(e.code); });
      addEventListener("keyup", (e) => walk.keys.delete(e.code));

      function applyWalk() {
        persp.position.copy(walk.pos);
        persp.rotation.set(0, 0, 0);
        persp.rotateY(walk.yaw);
        persp.rotateX(walk.pitch);
      }
      function stepWalk(dt) {
        if (!walk.on) return;
        const sp = (walk.keys.has("ShiftLeft") || walk.keys.has("ShiftRight") ? 3.1 : 1.45) * dt;
        let fx = 0, fz = 0;
        if (walk.keys.has("KeyW")) fz -= 1;
        if (walk.keys.has("KeyS")) fz += 1;
        if (walk.keys.has("KeyA")) fx -= 1;
        if (walk.keys.has("KeyD")) fx += 1;
        if (!fx && !fz) return;
        const l = Math.hypot(fx, fz); fx /= l; fz /= l;
        const sin = Math.sin(walk.yaw), cos = Math.cos(walk.yaw);
        const dx = (fx * cos + fz * sin) * sp;
        const dz = (-fx * sin + fz * cos) * sp;
        // Try full move, then each axis alone, so we slide along obstacles.
        for (const [ax, az] of [[dx, dz], [dx, 0], [0, dz]]) {
          const nx = walk.pos.x + ax, nz = walk.pos.z + az;
          if (walkFree(nx, nz)) { walk.pos.x = nx; walk.pos.z = nz; break; }
        }
        walk.pos.y = 1.62 + stairLift(walk.pos.x, walk.pos.z);
        applyWalk();
      }
      const R = 0.24;
      function walkFree(tx, tz) {
        const px = tx + S.cx, py = -tz + S.cy;   // back to plan coords
        if (px < R || px > S.W - R || py < R || py > S.D - R) return false;
        const me = { minx: px - R, maxx: px + R, miny: py - R, maxy: py + R };
        for (const b of S.blockers) if (overlaps(me, b)) return false;
        for (const [, o] of S.recs) {
          if (!isFloorSolid(o) || o.size.h < 0.45) continue;
          if (overlaps(me, rectOf(o))) return false;
        }
        return true;
      }
      // Walking onto the stair raises the eye height instead of blocking.
      function stairLift(tx, tz) {
        const st = S.recs.get("stair");
        if (!st || st.hidden) return 0;
        const px = tx + S.cx, py = -tz + S.cy;
        const r = rectOf(st);
        if (px < r.minx || px > r.maxx || py < r.miny || py > r.maxy) return 0;
        const t = (py - r.miny) / (r.maxy - r.miny);   // 0 at bottom (south), 1 at top
        return t * st.size.h * 0.92;
      }

      /* ─────────────────────── layouts / presets / URL ───────────────── */
      function applyOverrides(ov) {
        for (const [id, b] of S.base) {
          const rec = S.recs.get(id);
          rec.rotation_deg = b.rot; rec.elevation = b.elev; rec.hidden = false;
          rec.position.x = b.x; rec.position.y = b.y;
          placeGroup(id);
        }
        for (const [id, v] of Object.entries(ov || {})) {
          const rec = S.recs.get(id);
          if (!rec) continue;
          if (v.rot !== undefined) rec.rotation_deg = v.rot;
          if (v.elev !== undefined) rec.elevation = v.elev;
          if (v.hidden !== undefined) rec.hidden = v.hidden;
          if (v.x !== undefined) rec.position.x = v.x;
          if (v.y !== undefined) rec.position.y = v.y;
          placeGroup(id);
        }
        syncOutline(); syncList(); syncInspector();
      }
      const currentOverrides = () => {
        const out = {};
        for (const [id, rec] of S.recs) {
          const b = S.base.get(id);
          if (Math.abs(rec.position.x - b.x) > 1e-3 || Math.abs(rec.position.y - b.y) > 1e-3 ||
              rec.rotation_deg !== b.rot || rec.elevation !== b.elev || rec.hidden) {
            out[id] = { x: +rec.position.x.toFixed(3), y: +rec.position.y.toFixed(3), rot: rec.rotation_deg };
            if (rec.elevation !== b.elev) out[id].elev = +rec.elevation.toFixed(3);
            if (rec.hidden) out[id].hidden = true;
          }
        }
        return out;
      };

      const LS = "roomplanner.layouts.v1";
      const userLayouts = () => { try { return JSON.parse(localStorage.getItem(LS)) || []; } catch { return []; } };
      function syncPresets(sel) {
        const el = $("#preset");
        el.innerHTML = "";
        for (const p of S.schema.layout_presets) {
          const o = document.createElement("option");
          o.value = "p:" + p.id; o.textContent = p.label;
          el.appendChild(o);
        }
        const mine = userLayouts();
        if (mine.length) {
          const g = document.createElement("optgroup");
          g.label = "saved";
          for (let i = 0; i < mine.length; i++) {
            const o = document.createElement("option");
            o.value = "u:" + i; o.textContent = mine[i].name;
            g.appendChild(o);
          }
          el.appendChild(g);
        }
        if (sel) el.value = sel;
      }
      $("#preset").onchange = (e) => {
        const v = e.target.value;
        if (v.startsWith("p:")) {
          const p = S.schema.layout_presets.find((x) => x.id === v.slice(2));
          applyOverrides(p.overrides);
          toast(p.note || p.label);
        } else {
          const l = userLayouts()[+v.slice(2)];
          applyOverrides(l.overrides);
          toast("loaded “" + l.name + "”");
        }
      };
      $("#b-save").onclick = () => {
        const name = prompt("name this layout");
        if (!name) return;
        const mine = userLayouts();
        mine.push({ name, overrides: currentOverrides() });
        localStorage.setItem(LS, JSON.stringify(mine));
        syncPresets("u:" + (mine.length - 1));
        toast("saved");
      };
      $("#b-link").onclick = async () => {
        const enc = btoa(unescape(encodeURIComponent(JSON.stringify(currentOverrides()))));
        const url = location.origin + location.pathname + location.search + "#l=" + enc;
        try { await navigator.clipboard.writeText(url); toast("link copied"); }
        catch { location.hash = "l=" + enc; toast("link in address bar"); }
      };
      $("#b-reset").onclick = () => { applyOverrides({}); syncPresets("p:as_photographed"); toast("reset"); };

      /* ─────────────────────── photo compare ────────────────────────── */
      async function initCompare() {
        const wrap = $("#cam-btns");
        wrap.innerHTML = "";
        let found = 0;
        for (let i = 0; i < S.schema.cameras.length; i++) {
          const c = S.schema.cameras[i];
          // The standalone build has no reference/ directory to probe, so skip
          // straight to "not found" rather than logging five failed requests.
          const ok = window.__NO_REFERENCE__ ? false : await new Promise((res) => {
            const im = new Image();
            im.onload = () => res(true);
            im.onerror = () => res(false);
            im.src = c.file;
          });
          if (ok) { S.photos.set(c.id, c.file); found++; }
          const b = document.createElement("button");
          b.className = "b";
          b.textContent = c.id;
          b.title = c.label + (ok ? "" : " — photo not found");
          b.style.opacity = ok ? 1 : 0.45;
          b.onclick = () => gotoCam(i);
          wrap.appendChild(b);
        }
        $("#cam-note").textContent = found
          ? `${found}/${S.schema.cameras.length} reference photos found. Poses are estimated — use the slider to blink between photo and model.`
          : `No photos in reference/. Camera poses still work; drop the JPGs in to enable overlay.`;
      }
      function gotoCam(i) {
        S.camIdx = i;
        const c = S.schema.cameras[i];
        setMode("orbit");
        camera = persp;
        persp.fov = c.fov || 62; persp.updateProjectionMatrix();
        persp.position.copy(toThree(c.position.x, c.position.y, c.position.z));
        controls.target.copy(toThree(c.look_at.x, c.look_at.y, c.look_at.z));
        controls.update();
        const f = S.photos.get(c.id);
        $("#compare-img").src = f || "";
        $("#compare").classList.toggle("show", !!f && S.compare);
        $("#h-status").textContent = "view " + c.id + " · " + c.label;
      }
      $("#btn-compare").onclick = () => {
        S.compare = !S.compare;
        $("#btn-compare").classList.toggle("on", S.compare);
        $("#cambar").classList.toggle("show", S.compare);
        if (S.compare) gotoCam(S.camIdx);
        else $("#compare").classList.remove("show");
      };
      $("#ov").oninput = (e) => {
        $("#ov-val").textContent = e.target.value + "%";
        $("#compare-img").style.opacity = e.target.value / 100;
      };

      /* ─────────────────────────── boot ─────────────────────────────── */
      function onResize() {
        renderer.setSize(innerWidth, innerHeight);
        persp.aspect = innerWidth / innerHeight;
        persp.updateProjectionMatrix();
        fitOrtho();
      }
      addEventListener("resize", onResize);

      let prev = performance.now();
      function loop(now) {
        const dt = Math.min(0.05, (now - prev) / 1000);
        prev = now;
        if (S.mode === "orbit") controls.update();
        if (S.mode === "plan") { planControls.update(); syncLabels(); }
        if (S.mode === "walk") stepWalk(dt);
        renderer.render(scene, camera);
        requestAnimationFrame(loop);
      }

      (async function main() {
        let schema = window.__GREAT_ROOM_SCHEMA__;   // set by the standalone build
        if (!schema) {
          try {
            const res = await fetch(SCHEMA_URL);
            if (!res.ok) throw new Error(res.status + " " + res.statusText);
            schema = await res.json();
          } catch (err) {
            $("#h-sub").textContent = "could not load " + SCHEMA_URL + " — " + err.message;
            return;
          }
        }
        S.schema = schema;
        S.pal = schema.palette;
        S.W = schema.bbox.max.x - schema.bbox.min.x;
        S.D = schema.bbox.max.y - schema.bbox.min.y;
        S.H = schema.ceiling_height;
        S.cx = S.W / 2; S.cy = S.D / 2;

        buildTextures(S.pal);
        buildMaterials(S.pal);
        buildShell();
        buildLights();
        buildObjects();

        $("#h-title").textContent = schema.title || schema.name;
        $("#h-sub").textContent =
          `${S.W.toFixed(2)} × ${S.D.toFixed(2)} m · ceiling ${S.H.toFixed(2)} m · ` +
          `${schema.objects.length} objects · ${schema.provenance?.source_views ?? "?"} source views`;

        syncList();
        syncPresets("p:as_photographed");
        setMode("orbit");
        initCompare();

        // Restore a layout from the URL hash, if present.
        const m = location.hash.match(/l=([^&]+)/);
        if (m) {
          try { applyOverrides(JSON.parse(decodeURIComponent(escape(atob(m[1]))))); toast("layout from link"); }
          catch { /* ignore a malformed hash */ }
        }
        requestAnimationFrame(loop);
      })();

      window.DEBUG = { S, THREE, scene, get camera() { return camera; } };
    </script>
  </body>
</html>
