<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>block-bloc · viewer</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #050507; color: #eef; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      canvas { display: block; }
      #info {
        position: fixed; top: 12px; left: 12px; z-index: 10;
        background: rgba(0,0,0,.72); padding: 12px 16px; border-radius: 10px;
        max-width: 360px; backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.08);
      }
      #info .label { font-size: 11px; letter-spacing: .15em; text-transform: uppercase; opacity: .55; }
      #info .title { font-size: 14px; margin: 2px 0 8px 0; }
      #info .status { font-size: 12px; opacity: .8; }
      #info a { color: #9cf; }
      #controls {
        position: fixed; bottom: 12px; left: 12px; z-index: 10;
        background: rgba(0,0,0,.72); padding: 10px 14px; border-radius: 10px;
        font-size: 11px; opacity: .85; backdrop-filter: blur(8px);
      }
      #controls kbd { background: rgba(255,255,255,.12); padding: 1px 5px; border-radius: 3px; font-family: ui-monospace, monospace; font-size: 10px; }
      #adjust {
        position: fixed; bottom: 12px; right: 12px; z-index: 10;
        background: rgba(0,0,0,.72); padding: 10px 14px; border-radius: 10px;
        font-size: 11px; backdrop-filter: blur(8px); display: flex; flex-direction: column; gap: 4px;
      }
      #adjust label { display: flex; gap: 6px; align-items: center; opacity: .85; }
      #adjust .modes { display: flex; gap: 4px; margin-bottom: 2px; }
      #adjust .modes a { color: #9cf; text-decoration: none; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,.08); }
      #adjust .modes a.active { background: #3576cf; color: #fff; }
      #adjust button { background: rgba(255,255,255,.12); color: #eef; border: none; border-radius: 4px; padding: 4px 8px; font-size: 11px; cursor: pointer; margin-top: 4px; }
      #adjust button:hover { background: rgba(255,255,255,.18); }
      #walk-overlay {
        position: fixed; inset: 0; z-index: 15; display: flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,.35); cursor: pointer;
      }
      #walk-overlay .card {
        background: rgba(0,0,0,.8); border: 1px solid rgba(255,255,255,.15); border-radius: 12px;
        padding: 22px 30px; text-align: center; font-size: 15px; backdrop-filter: blur(10px);
      }
      #walk-overlay .card .sub { font-size: 12px; opacity: .7; margin-top: 8px; }
      #walk-overlay kbd { background: rgba(255,255,255,.12); padding: 1px 6px; border-radius: 3px; font-family: ui-monospace, monospace; font-size: 12px; }
      #record-overlay { position: fixed; top: 0; left: 0; right: 0; height: 4px; background: #e74c3c; z-index: 20; transition: width .1s linear; display: none; }
      #record-status { position: fixed; top: 14px; right: 14px; z-index: 20; background: rgba(231,76,60,.9); color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 12px; font-family: ui-monospace, monospace; display: none; }
    </style>
  </head>
  <body>
    <div id="info">
      <div class="label">block-bloc</div>
      <div class="title" id="title">living-room</div>
      <div class="status" id="status">Loading splat via Spark…</div>
    </div>
    <div id="controls"></div>
    <div id="adjust">
      <div class="modes" id="mode-links"></div>
      <label>flip Y <input type="checkbox" id="flip-y-in" /></label>
      <label>flip Z <input type="checkbox" id="flip-z-in" /></label>
      <button id="reset-view">↵ back to capture pose</button>
      <button id="record-flythrough" style="background:#3576cf;color:#fff">🎬 record flythrough</button>
      <button id="copy-url">copy URL</button>
    </div>
    <div id="walk-overlay" style="display:none">
      <div class="card">
        <div>click to walk</div>
        <div class="sub"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move · mouse look · <kbd>⇧</kbd> run · <kbd>Esc</kbd> exit</div>
      </div>
    </div>
    <div id="record-overlay"></div>
    <div id="record-status"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://esm.sh/three@0.180.0",
          "three/addons/": "https://esm.sh/three@0.180.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      // Viewer follows World Labs' OWN recipe for Marble worlds, taken verbatim
      // from worldlabsai/worldlabs-api-examples/web-generate-world + the Spark
      // docs (loading-splats.md) + Spark's streaming-lod example (which ships
      // real Marble worlds). The whole thing is 3 facts:
      //
      //   1. Marble .spz is OpenCV convention (y-down). Re-orient to OpenGL
      //      with a 180° rotation about X: splat.quaternion.set(1, 0, 0, 0).
      //   2. The generation viewpoint IS the splat origin. There is NO camera-
      //      pose metadata in the world JSON or the .spz. So the camera starts
      //      at (0,0,0) with identity orientation — that's the original pano
      //      camera pose, guaranteed inside the room, at eye height (~1.6 m
      //      above the floor, per the pipeline's pano render).
      //   3. Camera modes (?mode=walk|fly|orbit, default walk):
      //        walk  — hand-rolled pointer-lock FPS: yaw/pitch mouse-look (no
      //                roll), WASD on the yaw XZ plane, eye height locked at
      //                y=0 (= capture eye height). Optional &collider=<glb-url>
      //                enables floor-follow + wall sliding via raycasts.
      //        fly   — SparkControls free-fly (WASD + drag look + Q/E roll),
      //                the previous default. What World Labs uses.
      //        orbit — three.js OrbitControls, inspect-from-a-point mode.
      //
      // NB (TDZ, internal.md note 26): order-sensitive bindings — params, mode,
      // element refs, walk-state — are all declared at the top of this module,
      // BEFORE any function that closes over them can possibly run.
      import * as THREE from "three";
      import * as Spark from "https://esm.sh/@sparkjsdev/spark@2.1.0?deps=three@0.180.0";
      const { SparkRenderer, SplatMesh, SparkControls } = Spark;

      // --- URL params (all declared up front — TDZ note 26) ---
      const params = new URLSearchParams(location.search);
      const DEFAULT_SPZ = "https://cdn.marble.worldlabs.ai/bd1c3e7a-e412-4950-bb82-045f95f047a5/0dea05c6-6b15-4d51-bc0d-5f46b5e3df5a_ceramic_500k.spz";
      const spzUrl = params.get("spz") || DEFAULT_SPZ;
      const titleArg = params.get("title");
      if (titleArg) document.getElementById("title").textContent = titleArg;
      let flipY = params.get("flip_y") !== "false";
      let flipZ = params.get("flip_z") === "true";
      const scaleArg = parseFloat(params.get("scale") || "1") || 1;
      const yOffsetArg = parseFloat(params.get("y_offset") || "0") || 0;
      const colliderUrl = params.get("collider");

      // Mode: walk | fly | orbit. Default walk; pointer lock is useless on
      // touch devices, so they fall back to fly (drag-look works there).
      const isTouch = "ontouchstart" in window || navigator.maxTouchPoints > 0;
      const modeParam = (params.get("mode") || "").toLowerCase();
      const mode = ["walk", "fly", "orbit"].includes(modeParam) ? modeParam : (isTouch ? "fly" : "walk");

      // --- Element refs (top-level, order-sensitive) ---
      const statusEl = document.getElementById("status");
      const controlsEl = document.getElementById("controls");
      const walkOverlay = document.getElementById("walk-overlay");
      const modeLinksEl = document.getElementById("mode-links");

      // --- Walk-mode state (declared before the render loop closes over it) ---
      let yaw = 0, pitch = 0;               // radians; pitch clamped ±85°
      const keys = new Set();
      const EYE_HEIGHT = 1.6;               // used only with a collider floor hit
      let eyeY = 0;                          // current eye y (0 = capture height)
      let colliderMeshes = [];               // raycast targets (empty ⇒ plain walk)
      let colliderRoot = null;

      // --- Renderer (WL uses antialias:false; we add preserveDrawingBuffer so
      // the headless recorder can canvas.toDataURL the frames). ---
      const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050507);

      // WL's exact camera init: fov 65, near 0.01, far 1000, AT ORIGIN, identity.
      const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.01, 1000);
      camera.position.set(0, 0, 0);
      camera.quaternion.set(0, 0, 0, 1);

      const spark = new SparkRenderer({ renderer });
      scene.add(spark);

      const splat = new SplatMesh({ url: spzUrl });
      function applyOrientation() {
        // base: OpenCV→OpenGL 180° about X when flipY (the normal case)
        const q = new THREE.Quaternion();
        if (flipY) q.set(1, 0, 0, 0);           // 180° about X
        else q.set(0, 0, 0, 1);                  // identity
        if (flipZ) {                              // optional extra 180° about Y
          q.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.PI));
        }
        q.normalize();
        splat.quaternion.copy(q);
        splat.scale.setScalar(scaleArg);
        splat.position.y = yOffsetArg;
        // The collider mesh must live in the SAME frame as the splat.
        if (colliderRoot) {
          colliderRoot.quaternion.copy(q);
          colliderRoot.scale.setScalar(scaleArg);
          colliderRoot.position.y = yOffsetArg;
          colliderRoot.updateMatrixWorld(true);
        }
      }
      applyOrientation();
      scene.add(splat);

      // --- Controls per mode ---
      // fly: SparkControls, instantiated ONLY in fly mode so its canvas drag
      // listeners don't fight walk/orbit.
      let flyControls = null;
      let orbitControls = null;
      if (mode === "fly") {
        flyControls = new SparkControls({ canvas: renderer.domElement });
      } else if (mode === "orbit") {
        // three.js addon via the import map (same pinned three@0.180.0).
        import("three/addons/controls/OrbitControls.js").then(({ OrbitControls }) => {
          orbitControls = new OrbitControls(camera, renderer.domElement);
          orbitControls.target.set(0, 0, -2);   // 2 m into the room from capture pose
          orbitControls.enableDamping = true;
          orbitControls.update();
        }).catch((e) => {
          console.warn("OrbitControls failed to load — falling back to static camera", e);
          statusEl.textContent = "orbit controls failed to load — reload or use ?mode=walk";
        });
      }

      // --- Collider (flag-gated collision stretch; ANY failure ⇒ plain walk) ---
      if (colliderUrl && mode === "walk") {
        import("three/addons/loaders/GLTFLoader.js").then(async ({ GLTFLoader }) => {
          const gltf = await new GLTFLoader().loadAsync(colliderUrl);
          colliderRoot = gltf.scene;
          const meshes = [];
          colliderRoot.traverse((o) => {
            if (o.isMesh) { o.visible = false; meshes.push(o); }  // invisible; raycasts still hit
          });
          scene.add(colliderRoot);
          applyOrientation();                  // same transform as the splat
          colliderMeshes = meshes;
          console.log(`collider loaded: ${meshes.length} mesh(es)`);
        }).catch((e) => {
          console.warn("collider load failed — degrading to plain walk", e);
          colliderMeshes = [];
        });
      }

      // --- Walk mode: hand-rolled pointer-lock FPS (~60 LOC, no Spark
      // FpsMovement/PointerControls). Yaw+pitch only — Euler YXZ is the
      // body-yaw/head-pitch decomposition, so roll can never accumulate. ---
      const raycaster = new THREE.Raycaster();
      const DOWN = new THREE.Vector3(0, -1, 0);
      function walkUpdate(dt) {
        camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, "YXZ"));
        const f = (keys.has("KeyW") ? 1 : 0) - (keys.has("KeyS") ? 1 : 0);
        const s = (keys.has("KeyD") ? 1 : 0) - (keys.has("KeyA") ? 1 : 0);
        if (f || s) {
          const speed = 1.5 * (keys.has("ShiftLeft") || keys.has("ShiftRight") ? 2 : 1);
          // Move on the camera-yaw XZ plane (pitch never bleeds into motion).
          const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
          const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
          const move = fwd.multiplyScalar(f).add(right.multiplyScalar(s)).normalize().multiplyScalar(speed * dt);
          if (colliderMeshes.length) {
            try {
              // Wall blocking: 2 short horizontal rays fanned ±25° around the
              // move direction. On hit, slide along the wall (remove the
              // into-wall component) instead of stopping dead.
              const dir = move.clone().normalize();
              for (const ang of [0.44, -0.44]) {
                const rd = dir.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), ang);
                raycaster.set(camera.position, rd);
                raycaster.far = 0.45;
                const hit = raycaster.intersectObjects(colliderMeshes, false)[0];
                if (hit && hit.face) {
                  const n = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
                  n.y = 0; n.normalize();
                  move.sub(n.multiplyScalar(move.dot(n)));
                }
              }
            } catch (e) {
              console.warn("collider raycast failed — disabling collision", e);
              colliderMeshes = [];
            }
          }
          camera.position.x += move.x;
          camera.position.z += move.z;
        }
        // Floor-follow: downward ray → y = hit + eye height; no hit ⇒ y = 0
        // (origin = capture eye height per the pipeline contract).
        if (colliderMeshes.length) {
          try {
            raycaster.set(new THREE.Vector3(camera.position.x, eyeY + 0.5, camera.position.z), DOWN);
            raycaster.far = 5;
            const hit = raycaster.intersectObjects(colliderMeshes, false)[0];
            const targetY = hit ? hit.point.y + EYE_HEIGHT : 0;
            eyeY += (targetY - eyeY) * Math.min(1, dt * 10);   // smooth steps
          } catch (e) {
            console.warn("floor raycast failed — disabling collision", e);
            colliderMeshes = [];
            eyeY = 0;
          }
        } else {
          eyeY = 0;
        }
        camera.position.y = eyeY;
      }

      // Pointer lock plumbing (walk mode only).
      if (mode === "walk") {
        walkOverlay.style.display = "";
        walkOverlay.addEventListener("click", () => renderer.domElement.requestPointerLock());
        document.addEventListener("pointerlockchange", () => {
          const locked = document.pointerLockElement === renderer.domElement;
          walkOverlay.style.display = locked ? "none" : "";
        });
        document.addEventListener("mousemove", (e) => {
          if (document.pointerLockElement !== renderer.domElement) return;
          yaw -= e.movementX * 0.0022;
          pitch = Math.max(-Math.PI * 85 / 180, Math.min(Math.PI * 85 / 180, pitch - e.movementY * 0.0022));
        });
        document.addEventListener("keydown", (e) => keys.add(e.code));
        document.addEventListener("keyup", (e) => keys.delete(e.code));
        addEventListener("blur", () => keys.clear());
      }

      // Expose for the headless recorder (render_flythrough.mjs).
      window.DEBUG = { THREE, Spark, scene, camera, splat, spark, renderer };
      window.__recording = false;

      // --- Render loop. Skip control updates while recording so the recorder
      // can drive the camera pose directly without a fight. ---
      let prevT = performance.now();
      renderer.setAnimationLoop((t) => {
        const dt = Math.min((t - prevT) / 1000, 0.05);
        prevT = t;
        if (!window.__recording) {
          if (mode === "fly" && flyControls) flyControls.update(camera);
          else if (mode === "orbit" && orbitControls) orbitControls.update();
          else if (mode === "walk") walkUpdate(dt);
        }
        renderer.render(scene, camera);
      });

      // Ready signal for the recorder + status line. Spark's getBoundingBox()
      // (NOT Box3.setFromObject — internal.md note 19) returns LOCAL bounds;
      // size alone is frame-independent so no matrixWorld needed here. The
      // recorder applies splat.matrixWorld for the world-space bbox (note 27).
      let ready = false;
      const readyPoll = setInterval(() => {
        try {
          const box = splat.getBoundingBox();
          const sz = box.getSize(new THREE.Vector3());
          if (sz.length() > 0.1 && isFinite(sz.x)) {
            ready = true;
            statusEl.innerHTML = `Spark ready · <a href="${spzUrl}" target="_blank">.spz</a>`;
            clearInterval(readyPoll);
          }
        } catch {}
      }, 400);
      setTimeout(() => clearInterval(readyPoll), 30000);

      // --- HUD per mode + mode switcher links ---
      const HUD = {
        walk: `<kbd>click</kbd> to walk · <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move · mouse look · <kbd>⇧</kbd> run · <kbd>Esc</kbd> release`,
        fly: `<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move · <kbd>Q</kbd>/<kbd>E</kbd> roll · <kbd>⇧</kbd> faster · <kbd>drag</kbd> look`,
        orbit: `<kbd>drag</kbd> orbit · <kbd>scroll</kbd> zoom · <kbd>right-drag</kbd> pan`,
      };
      controlsEl.innerHTML = `<b style="text-transform:uppercase;letter-spacing:.1em;font-size:10px;opacity:.6">${mode}</b> · ${HUD[mode]}`;
      function urlWithMode(m) {
        const p = new URLSearchParams(location.search);
        p.set("mode", m);
        return `${location.pathname}?${p.toString()}`;
      }
      modeLinksEl.innerHTML = ["walk", "fly", "orbit"]
        .map((m) => `<a href="${urlWithMode(m)}" class="${m === mode ? "active" : ""}">${m}</a>`)
        .join("");

      // --- UI ---
      const flipYEl = document.getElementById("flip-y-in"); flipYEl.checked = flipY;
      const flipZEl = document.getElementById("flip-z-in"); flipZEl.checked = flipZ;
      flipYEl.addEventListener("change", () => { flipY = flipYEl.checked; applyOrientation(); });
      flipZEl.addEventListener("change", () => { flipZ = flipZEl.checked; applyOrientation(); });

      function backToCapturePose() {
        camera.position.set(0, 0, 0);
        camera.quaternion.set(0, 0, 0, 1);
        yaw = 0; pitch = 0; eyeY = 0;
        if (orbitControls) { orbitControls.target.set(0, 0, -2); orbitControls.update(); }
      }
      document.getElementById("reset-view").addEventListener("click", backToCapturePose);

      document.getElementById("copy-url").addEventListener("click", () => {
        const p = new URLSearchParams();
        p.set("spz", spzUrl);
        if (titleArg) p.set("title", titleArg);
        p.set("flip_y", String(flipY));
        p.set("flip_z", String(flipZ));
        p.set("mode", mode);
        if (scaleArg !== 1) p.set("scale", String(scaleArg));
        if (yOffsetArg !== 0) p.set("y_offset", String(yOffsetArg));
        if (colliderUrl) p.set("collider", colliderUrl);
        const u = `${location.origin}${location.pathname}?${p.toString()}`;
        navigator.clipboard.writeText(u);
        const btn = document.getElementById("copy-url");
        const prev = btn.textContent; btn.textContent = "copied!";
        setTimeout(() => { btn.textContent = prev; }, 1200);
      });

      // --- Flythrough recorder (interactive / real-browser path) ---
      // "Camera pose fixed": the camera stays AT the capture origin and does a
      // 360° turntable look-around with a small drift circle for parallax. This
      // is exactly the original pano vantage, so it never wanders into the
      // Marble-dreamed content beyond windows/doors.
      const DURATION_SEC = 8, FPS = 30, DRIFT = 0.35;
      const recordBtn = document.getElementById("record-flythrough");
      const overlay = document.getElementById("record-overlay");
      const recStatus = document.getElementById("record-status");
      let recording = false;

      // Pose at normalized time t (0..1). Starts and ends at the EXACT original
      // capture pose: position (0,0,0), looking down -Z (the camera's identity
      // orientation). A Three.js camera at identity looks toward -Z, and the
      // splat is oriented (quaternion 1,0,0,0) so that -Z is the room's "front"
      // — i.e. how Marble captured it. The sweep yaws a full 360° back to start,
      // and the lateral drift is enveloped by sin(πt) so it's exactly 0 at both
      // ends. Net: frame 0 = the capture pose, the clip loops cleanly.
      function poseAt(t) {
        const yawT = t * Math.PI * 2;                 // 0 → 2π, back to facing -Z
        const drift = DRIFT * Math.sin(Math.PI * t);  // 0 at t=0 and t=1, max mid
        const px = Math.cos(yawT) * drift;
        const pz = Math.sin(yawT) * drift;
        const py = 0.03 * Math.sin(Math.PI * t * 2);  // subtle bob, 0 at t=0
        // Forward(yaw=0) = -Z so frame 0 matches camera identity. As yaw grows,
        // forward sweeps a full turn: (-sin yaw, 0, -cos yaw).
        const fx = -Math.sin(yawT), fz = -Math.cos(yawT);
        const look = new THREE.Vector3(px + fx * 3, py - 0.08, pz + fz * 3);
        const m = new THREE.Matrix4().lookAt(new THREE.Vector3(px, py, pz), look, new THREE.Vector3(0, 1, 0));
        const q = new THREE.Quaternion().setFromRotationMatrix(m);
        return { pos: [px, py, pz], quat: [q.x, q.y, q.z, q.w] };
      }
      window.__poseAt = poseAt;  // headless recorder reuses this

      async function recordFlythrough() {
        if (recording || !ready) { if (!ready) alert("splat still loading"); return; }
        recording = true; window.__recording = true;
        recordBtn.disabled = true; recordBtn.textContent = "🎬 recording…";
        recStatus.style.display = ""; overlay.style.display = "";

        const stream = renderer.domElement.captureStream(FPS);
        const mime = ["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"].find((m) => MediaRecorder.isTypeSupported(m)) || "";
        const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8_000_000 });
        const chunks = [];
        rec.ondataavailable = (e) => e.data?.size && chunks.push(e.data);
        rec.start();

        const total = DURATION_SEC * FPS, frameMs = 1000 / FPS, t0 = performance.now();
        await new Promise((resolve) => {
          function step() {
            const idx = Math.min(total - 1, Math.floor((performance.now() - t0) / frameMs));
            const p = poseAt(idx / (total - 1));
            camera.position.set(...p.pos);
            camera.quaternion.set(...p.quat);
            overlay.style.width = (idx / (total - 1) * 100) + "%";
            recStatus.textContent = `recording · ${idx + 1}/${total}`;
            if (idx >= total - 1) resolve(); else requestAnimationFrame(step);
          }
          requestAnimationFrame(step);
        });

        await new Promise((resolve) => { rec.onstop = resolve; rec.stop(); });
        const blob = new Blob(chunks, { type: mime || "video/webm" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `${titleArg || "block-bloc"}-flythrough-${Date.now()}.webm`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);

        recStatus.textContent = `saved · ${(blob.size / 1024 / 1024).toFixed(1)} MB`;
        overlay.style.display = "none"; recordBtn.disabled = false; recordBtn.textContent = "🎬 record flythrough";
        setTimeout(() => { recStatus.style.display = "none"; }, 4000);
        recording = false; window.__recording = false;
        backToCapturePose();
      }
      recordBtn.addEventListener("click", recordFlythrough);

      addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
    </script>
  </body>
</html>
